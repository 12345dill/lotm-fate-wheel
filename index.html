const EVENTS = [
  /* ===== 克莱恩穿越前（1331-1349，主角当前主流程）===== */
  { id:'b01', period:'before', places:[], name:'深夜的占卜摊', short:'占卜摊',
    text:'1341 年的深秋，你路过街角的旧货铺，看见一位披灰斗篷的占卜师支起了摊子。她自称能看见"命运线上的旧伤"，只用一枚铜板就愿意给你算一卦。你坐下了。她盯着你看了很久，然后说出一句让你脊背发凉的话："你身上有一道不属于这个时代的影子。"她没收你的钱，只是叮嘱你：往后的星期三，少走夜路。',
    reward:'神秘+1', attr:{mystery:1}, follow:'b01b',
    battle:false, mandatory:false },
  { id:'b01b', period:'before', places:[], name:'星期三的雨', short:'星期三',
    text:'你记住了占卜师的话，逢星期三不再走夜路。有一夜你临时有事不得不出门，恰逢大雨，你躲进一座废弃钟楼避雨。钟楼的顶层有人在哭——那哭声像猫又像婴儿。你本想离开，却在楼梯转角捡到一枚银质胸针，上面刻着黑夜女神的纹章。雨停之后，钟楼里再无异响，而那枚胸针，你贴身收着，总觉得它在夜里微微发烫。',
    reward:'幸运+1、理智-5', attr:{luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b02', period:'before', places:['廷根市','贝克兰德','普利兹港'], name:'黑荆棘安保公司', short:'黑荆棘', orgOnly:true,
    text:'1348 年，你在街上张贴的告示里看到一则招聘：黑荆棘安保公司招一名夜间巡逻员，管吃住，薪水按周结。你去了。面试你的人是一位眼神锐利的中年人，他验过你的身份文书与教会推荐信，然后说："夜里的廷根不太平，但只要你不上夜路，我们就能护住你。"你签了字——作为教会的官方序列者，你知道这家"安保公司"背后真正的主人是谁。第一晚巡逻，你就听见仓库深处传来指甲刮墙的声音——领队按住你的肩："别管，值夜者的事，归我们。"',
    reward:'勇气+1、金钱+1、功绩+1', attr:{courage:1, wealth:1}, merit:1, follow:'b02b',
    battle:false, mandatory:false },
  { id:'b02b', period:'before', places:['廷根市'], name:'仓库里的影子', short:'仓库影子', orgOnly:true,
    text:'你在黑荆棘安保公司做了半年。某夜巡逻，你发现仓库的门缝里透出一线不寻常的光——不是烛火，是某种青灰色的光。你推开门，看见墙角蹲着一团蠕动的人形影子，它缓缓转过头，没有脸。你拔出组织配发的短剑——那是教会为序列者专门祝福过的武器。那影子发出无声的尖叫，"嗖"地缩进了墙缝。次日领队听完你的报告，沉默半晌，在功绩册上给你记了一笔："临危不乱，处置得当。"你领到一笔奖金，从此记住了：有些东西，看见了，就要以组织的名义处理。',
    reward:'金钱+2、功绩+2、理智-10', attr:{wealth:2}, merit:2, follow:null,
    battle:false, mandatory:false },
  { id:'b03', period:'before', places:['间海郡','费内波特山间','弗萨克北境'], name:'麦田里的老人', short:'麦田老人',
    text:'农忙时节，一位衣衫褴褛的老人坐在你家麦田边歇脚。他向你讨水喝，你端了碗井水给他。他喝完水，盯着麦浪看了很久，忽然说："今年的收成会好，但你们村的井，明年会枯三口。"你当他是胡话。可那年秋天麦子确实大丰收；第二年，村西的三口井真的见了底。老人再没出现过，但你总觉得，他腰间别着的那根木杖上，刻着某种你不认识的符号。',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b04', period:'before', places:['贝克兰德','特里尔','伦堡'], name:'雾中马车', short:'雾中马车',
    text:'你乘马车去城里办事，车夫忽然勒住缰绳。前方浓雾里停着一辆漆黑的马车，车帘紧闭，拉车的马一动不动，像是石雕。车夫脸色煞白，说什么也不肯往前。你壮着胆子下车，走近时听见车里传来低低的吟唱——古老、荒凉，不像任何你听过的语言。那吟唱突然停了。黑马车缓缓掉头，驶入雾中消失。车夫回来时，手里多了一枚金币，他坚称是你掉的，可你分明没带钱出门。',
    reward:'神秘+1、金钱+1', attr:{mystery:1, wealth:1}, follow:'b04b',
    battle:false, mandatory:false },
  { id:'b04b', period:'before', places:[], name:'金币上的刻痕', short:'金币刻痕',
    text:'那枚金币你一直留着。某夜你借着烛火细看，发现金币边缘刻着一圈极细的文字，你认不全，只能依稀拼出几个音节，像是"赞"与"夜"的变体。你把金币放回枕下，当晚就做了个梦：一条没有尽头的河，河边站着无数戴兜帽的人，他们齐刷刷转向你。你惊醒时，金币不见了。但你的手心里，多了一道淡淡的、银色的月牙印记。',
    reward:'神秘+2、理智-10', attr:{mystery:2}, follow:null,
    battle:false, mandatory:false },
  { id:'b05', period:'before', places:[], name:'图书馆的旧书', short:'旧书',
    text:'你在旧书店淘到一本没有书名的厚书，封皮是某种黑色皮革，摸上去冰凉。书页里的文字你大多不认识，但插画你却看得懂：有巨大的齿轮、深海的触须、燃烧的太阳和一只俯瞰大地的眼睛。你读到深夜，忽然发现某一页的插画"动"了一下——画里的眼睛转向了你。你猛地合上书，心跳如鼓。次日你把书放回书架最高处，但每晚入睡前，你都听见书页翻动的声音。',
    reward:'智慧+1、神秘+1、理智-5', attr:{wisdom:1, mystery:1}, follow:'b05b',
    battle:false, mandatory:false },
  { id:'b05b', period:'before', places:[], name:'书页的邀请', short:'书页邀请',
    text:'那本书在三个月后的一个清晨，自己从书架顶层掉了下来，摊开在你面前。摊开的那一页画着一扇门，门后是层层叠叠的楼梯。页边用你能看懂的通用语写着一行字："星期四午夜，旧钟楼，带上这本书。"你没有去。那天夜里，旧钟楼的钟响了十三下——全城都听见了，但第二天，所有人都说昨晚钟只响过十二下。你翻开书，那一页已经变成空白。你隐约觉得，你错过了一扇门，也躲过了一场麻烦。',
    reward:'幸运+1', attr:{luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b06', period:'before', places:[], name:'教堂唱诗班', short:'唱诗班',
    text:'你的声音不错，被教堂唱诗班收下。每周日的弥撒，你在圣坛前唱颂歌。有一回你高烧不退，浑浑噩噩间却照常去唱诗，结果那天你的声音格外清亮，连主教都驻足听了一会儿。退烧后，老神父把你叫到静室，问你是不是"见过光"。你摇头。他沉默片刻，送给你一枚小小的银质徽章，说："戴上它，神会记得你。"后来你才知道，那枚徽章是"无暗者"的象征。',
    reward:'信仰+2、理智+5', attr:{faith:2}, follow:null,
    battle:false, mandatory:false },
  { id:'b07', period:'before', places:['普利兹港','海上·风暴群岛'], name:'码头上的水手', short:'码头水手',
    text:'码头酒馆里，一位独臂老水手喝多了，拉着你说他在"白鲨"号上当过水手，见过海面下有巨大的影子跟着船航行。他说那不是鲸鱼，鲸鱼没有那种"像宫殿一样"的轮廓。他给你看他的航海日志，其中一页画着一座沉在海底的城市，塔尖戳破海面。他浑浊的眼睛看着你："孩子，大海比教堂更古老。你要是有机会，替我看看那座城的塔尖上，是不是真的挂着钟。"',
    reward:'勇气+1、神秘+1', attr:{courage:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b08', period:'before', places:[], name:'集市上的马戏团', short:'马戏团',
    text:'一个马戏团来到镇上，最受欢迎的是“通灵人”——一位戴黑纱的女士，声称能与死者对话。你出于好奇去了，她隔着水晶球看了你一眼，忽然尖叫起来，说看见你身后站着一团“没有影子的黑雾”。全场哗然，她也被马戏团主斥责了一顿。散场后她悄悄塞给你一枚磨旧的铜币：“孩子，别问我是谁告诉我的——你最近三个月，别去东边那座旧桥。”你将信将疑，但三个月里，你确实绕开了那座桥。后来你听说，那桥在一个暴雨夜塌了。',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b09', period:'before', places:['白银城'], name:'雷暴中的猎杀', short:'雷暴猎杀',
    text:'白银城的天空永远是铅灰色的。你在城墙上值守，远处雷暴间歇的微光里，一个畸形的影子贴着地面爬过来——是"无面犬"，一种被污染侵蚀的猎犬，皮肤上长满眼睛。你握紧手中的石矛，成年白银城人从不退缩，因为退缩等于死亡。你冲了上去，在雷光照亮它的瞬间，将石矛刺进它的眼窝。它嘶叫着化为一滩黑水。你回城时，守门的老兵拍了拍你的肩："好小子，造物主在上，你活得下来。"',
    reward:'勇气+1、体质+1', attr:{courage:1, constitution:1}, follow:null,
    battle:true, enemySeq:9, enemyName:'无面犬', enemyPath:'污染兽',
    mandatory:false },
  { id:'b10', period:'before', places:[], name:'老师的书房', short:'书房',
    text:'你的老师是个沉默寡言的老学究，书房里堆满积灰的典籍。他教你认字、算数，偶尔也教些"多余"的东西——比如如何用银针测风向，如何从脚印判断来者是否"非人"。你问他为什么教这些，他只说："乱世将至，多学点没坏处。"后来你发现，他书房的暗格里锁着一副旧怀表，表盖上刻着一行小字："不要忘记，也不要好奇。"你始终没有打开那个暗格。',
    reward:'智慧+1', attr:{wisdom:1}, follow:'b10b',
    battle:false, mandatory:false },
  { id:'b10b', period:'before', places:[], name:'老师的离开', short:'老师离开',
    text:'你十二岁生日那天，老师留了一封信就走了。信上只有一句话："你该学的，我都教完了。往北走，或者往南走，但别留在原地。"你打开暗格，怀表还在，旁边多了一本手抄本，扉页写着"非凡途径入门——误入者勿阅"。你翻了几页，又合上了。你把怀表贴身收好，手抄本藏进床底。那天晚上，你梦见老师站在一条雾蒙蒙的河边，朝你挥了挥手。',
    reward:'神秘+1、智慧+1', attr:{mystery:1, wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b11', period:'before', places:['伦堡','贝克兰德','特里尔'], name:'银行家的考卷', short:'银行考卷',
    text:'一家银行招收学徒，考试题里有一道：算出一艘货船的最优航线利润。别人都在纸上演算，你却在心里飞快地算完了——你的心算好得出奇。监考的秃顶先生看了你的答案，点点头，又额外给你一张纸："再算一道，这是去年的考题，当年没人答对。"你用了半炷香时间给出了答案。他笑了："你被录用了，少年，从明天起，你跟着我学做账。"',
    reward:'智慧+1、金钱+1', attr:{wisdom:1, wealth:1}, follow:'b11b',
    battle:false, mandatory:false },
  { id:'b11b', period:'before', places:[], name:'账本里的异常', short:'账本异常',
    text:'你在银行做了半年学徒，有一晚加班核账，发现一本旧账本里有一笔进账没有日期、没有来源，金额却大得惊人，后面还跟着一个奇怪的符号——像是被撕掉的一页留下的压痕。你问了师父，他脸色一沉，让你"忘了这笔账"。你忘了，但那个符号你偷偷描了下来。后来你在旧书店的插画里看到了几乎一模一样的符号——那是某个古老隐秘组织的标记。',
    reward:'金钱+1、神秘+1', attr:{wealth:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b12', period:'before', places:[], name:'雪夜的敲门声', short:'雪夜敲门',
    text:'一个风雪夜，有人敲你家的门。门外站着一位披斗篷的女士，帽檐压得很低，只露出苍白的下巴。她说她迷路了，想借宿一晚。你让她进来了。她坐在壁炉前，既不说话也不喝水，只是盯着火苗。天亮时她已经离开，桌上留了一枚银币——比任何流通的银币都要沉。你把它收进钱袋。后来你发现，只要随身带着这枚银币，走夜路时，街边的狗从不对你叫。',
    reward:'幸运+1、神秘+1', attr:{luck:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b13', period:'before', places:[], name:'竞技场的少年', short:'竞技场',
    text:'镇上的竞技场每周都办"友谊赛"，奖品是一袋面粉和一桶麦酒。你仗着体格好，报了名。第一场你赢了，第二场你遇到一个比你高两头的壮汉，你被摔了三次，全场都在笑。但你第四次站起来的时候，壮汉反而停了手，他拍了拍你的肩："有种，小子。跟我学两手？"他成了你的拳术师傅，教你如何在挨打时护住要害，如何在绝境里找到反击的那一线空隙。',
    reward:'体质+1、勇气+1', attr:{constitution:1, courage:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b14', period:'before', places:[], name:'画家的请求', short:'画家',
    text:'一位落魄画家请你当他的模特。你坐在窗边，他画了一下午。画完后他盯着画布看了很久，忽然把画撕了，说"画不出你的眼睛"。他给了你几个铜板，又认真地说："你的眼睛里有东西，少年。说不上来是什么，但它一直在看着你。"你摸了摸自己的脸，什么都没摸到。那天晚上你照镜子，镜子里你的眼睛，似乎比平时亮了一点点。',
    reward:'美貌+1、神秘+1', attr:{beauty:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b15', period:'before', places:['间海郡','弗萨克北境','费内波特山间'], name:'狼群之夜', short:'狼群',
    text:'冬天最冷的那段日子，村里闹狼灾。一连三夜，狼群都在村外嚎叫，猎户们设了陷阱，却什么也没抓到——地上的脚印是狼的，可脚印之间没有雪融的痕迹。第七夜，你在守夜时看见一头银灰色的巨狼站在村口的坡上，静静看着村庄，没有攻击的意思。你们对视了很久。天亮时它走了，从此狼灾平息。老人们说，那是"守夜的狼"，是某位古老存在巡视领地。你不太信，但你记得它眼睛的颜色——那种银色，像极了月光下的雪。',
    reward:'勇气+1、幸运+1', attr:{courage:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b16', period:'before', places:[], name:'墓园守夜人', short:'墓园',
    text:'你帮墓园守夜人代了三天班。第一夜平安无事；第二夜，你听见某个墓碑后面传来啜泣声，走过去却什么也没有；第三夜，你借着月光看见一个佝偻的身影在墓碑间缓缓移动，像是来祭扫的。你上前问需不需要帮忙，那身影缓缓转头——没有脸。你僵在原地。那身影却只是"看"了你一会儿，然后化作月光下的一缕青烟。守夜人回来后给了你双倍工钱，说："敢在墓园过三夜的人，不多。"',
    reward:'勇气+1、理智-5', attr:{courage:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b17', period:'before', places:[], name:'圣泉的传说', short:'圣泉',
    text:'传说城外的山里有口“圣泉”，能治百病，也有老人说那是“大地母神的眼泪”。你随采药人去寻泉水，翻了大半天，在一处隐蔽的山涧里找到了它——泉水清澈见底，水底沉着无数枚铜币。采药人说，向泉里投一枚铜币许愿，愿望就会实现。你投了一枚，许了个微不足道的愿望。三个月后，你发现那个愿望居然真的实现了。你再去时，泉水边多了一块石碑，上面刻着：“勿贪。”',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b18', period:'before', places:['贝克兰德','普利兹港','伦堡'], name:'地下的拍卖会', short:'地下拍卖',
    text:'你听说城里有个"地下拍卖会"，卖的都是见不得光的东西：走私的枪支、染血的宝石，还有——据传——"能让人看见另一个世界"的旧物。你混了进去。拍卖会上，一件不起眼的黑色雕像拍出了天价，买家是一位戴金丝眼镜的绅士，全程没说一句话。你注意到，雕像的眼睛上蒙着布条。散场时，有人拍了拍你的肩，低声说："别打听不该问的，孩子，有些人连名字都不能提。"',
    reward:'金钱+1、神秘+1、理智-5', attr:{wealth:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b19', period:'before', places:[], name:'铁匠铺的学徒', short:'铁匠',
    text:'你在铁匠铺打了一年下手，锤子抡出了肌肉，也抡出了火气。老铁匠脾气不好，但手艺没得说。有一回他打一把"特殊的刀"，刀刃淬火时水里掺了什么东西，整间铺子忽然冷得像冰窖。刀成之后，老铁匠把它锁进了里屋的铁箱，从此没再提起。你问过一回，他瞪了你一眼："有些东西，造出来就是为了锁起来。"后来你才知道，那把刀不是凡铁打的。',
    reward:'体质+1、金钱+1', attr:{constitution:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b20', period:'before', places:['白银城'], name:'白银城的试炼', short:'白银试炼',
    text:'白银城的孩子十岁要参加"成人试炼"：独自在城外坚守一夜。那一夜你蜷在石缝里，听着远处怪物的嚎叫和雷声。后半夜，一具腐烂的"走尸"拖着步子朝你藏身的地方走来，一步、一步，你数着它的脚步声，握紧了磨得发亮的骨刀。它走到你面前时，你已经站了起来——在白银城，站着死也比跪着活强。你砍断了它的颈骨。清晨回城时，首席的副手看了你一眼，只说了一句："够格。"',
    reward:'勇气+2、体质+1', attr:{courage:2, constitution:1}, follow:null,
    battle:true, enemySeq:9, enemyName:'走尸', enemyPath:'污染兽',
    mandatory:false },
  { id:'b21', period:'before', places:[], name:'深夜的茶会', short:'茶会',
    text:'你被一位远房亲戚邀请去参加"茶会"。茶会在夜里十一点开始，宾客们衣着考究，谈吐文雅，聊的话题却让你不安——他们谈论"序列""魔药""扮演法"，还有"灵界"。你端着一杯红茶坐在角落，假装听不懂。散会时，女主人送你到门口，微笑着对你说："孩子，非凡的世界不会因为你假装看不见就放过你。做好准备，或者，做好消失的准备。"',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:'b21b',
    battle:false, mandatory:false },
  { id:'b21b', period:'before', places:[], name:'茶会的邀请函', short:'邀请函',
    text:'茶会之后一个月，你收到一封烫金邀请函，落款是你那位远房亲戚。邀请函上写着下次茶会的时间地点，末尾附了一行小字：“这次，请带上你那晚捡到的东西。”你攥着邀请函，想起茶会女主人那句话。你犹豫了很久，最终还是没去。后来你听说，那晚的茶会出了事——有官方非凡者突袭了那个地址。你不知道自己是幸运还是不幸，只是把那枚胸针收得更深了些。',
    reward:'幸运+1、金钱+1', attr:{luck:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b22', period:'before', places:[], name:'河边的渔夫', short:'渔夫',
    text:'你常去河边钓鱼。老渔夫看你勤快，教了你几手。有一回鱼钩挂住了水底的东西，拉上来一看，是一尊巴掌大的青铜神像，面目模糊，像人又像兽。老渔夫看了一眼，脸色大变，让你赶紧扔回河里。你照做了。神像入水的瞬间，河面泛起一圈圈涟漪，然后——你发誓你看见水底有什么巨大的东西缓缓游过。老渔夫再没让你去那个钓位，他说那里"住着不好惹的东西"。',
    reward:'神秘+1、幸运-1', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b23', period:'before', places:[], name:'山道上的商队', short:'商队',
    text:'你跟着一支商队跑了一趟长途。夜里扎营时，商队头领请大家喝一种苦涩的草药茶，说是"防瘟疫"。你喝了一口，觉得味道怪，但没多问。半夜你被冻醒，看见头领独自坐在火堆边，手里拿着一根骨笛，低声吹着某种不成调的曲子。他看见你醒了，只是笑了笑："吹给山神听的，老规矩。"那趟货平安送到了。你临走时，头领塞给你一小包草药："路上保命用的，记住，有些地方的水不能喝，有些路不能走夜。"',
    reward:'体质+1、金钱+1', attr:{constitution:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b24', period:'before', places:[], name:'小巷里的乞丐', short:'乞丐',
    text:'你经常看见一个老乞丐蹲在教堂后门，从不乞讨，只是坐着晒太阳。有一回你给了他半块面包，他接过去，忽然开口说："你命里有水，也命里有火。水的那头是贵人，火的那头是灾星。记住，别往东走——至少这三年别往东走。"你当时觉得荒唐。第二年，城东确实出了事：一场大火烧了半个街区。你站在城西的桥上，看着东边的火光，想起老乞丐的话，后背一层冷汗。你再去找他时，他已经不见了。',
    reward:'幸运+1', attr:{luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b25', period:'before', places:[], name:'教会学校的禁书', short:'禁书',
    text:'教会学校图书馆的深处有一排"禁书架"，管理员是个打瞌睡的老修士。你趁他打盹时，抽出一本灰皮书翻了几页——里面记载着"魔女""亵渎""献祭"等字眼，还有各种你不认识的黑白插图。你正看得入神，一只手按住了书页。老修士不知何时醒了，他眯着眼看你："好奇是吧？"你点头。他叹了口气："好奇是好事，但你要记住——这本书里的东西，看懂了，就再也忘不掉了。"他把书收了回去，却没惩罚你。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b26', period:'before', places:['贝克兰德','特里尔','伦堡'], name:'蒸汽机的声音', short:'蒸汽机',
    text:'城里通了蒸汽机车。你第一次听见汽笛声时吓了一跳，那声音像某种巨兽的咆哮。你跟着人群去看了蒸汽机——它巨大的飞轮转动着，齿轮咬合，发出有节奏的轰鸣。一个穿工装的技师拍了拍锅炉，得意地说："这是时代的脉搏，小子。"你在蒸汽机前站了很久，心里忽然冒出一个念头：如果这世上真有"神"，那它会不会也在某个地方，像这台机器一样，日夜不停地运转着？',
    reward:'智慧+1', attr:{wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b27', period:'before', places:[], name:'井里的回声', short:'井回声',
    text:'村里有口老井，据说枯了很多年。有天你路过，听见井里传来回声——不是你的声音，是另一种低沉的、像来自很远地方的声音，一遍遍地重复着什么。你趴在井沿往下看，黑漆漆的什么也看不见。你捡了块石头丢下去，很久才听到落底的声音，那说明井很深。但那之后，井里的回声再也没有出现过。村里老人说，枯井听见回声，是"地底的东西醒了"。你后来尽量绕开那口井走。',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b28', period:'before', places:[], name:'旧宅的租客', short:'旧宅租客',
    text:'你家隔壁的空宅搬来了新租客，一位独居的中年绅士，养着一只黑猫。他很少出门，偶尔夜里能看见他书房的灯亮到很晚。有一回你帮他搬书箱，发现箱子里全是各种语言的典籍，其中一本的封面上画着一只俯瞰大地的眼睛。他注意到你的目光，笑了笑："你在看这本书？"你摇头。他意味深长地说："不看也好，看了，就甩不掉了。"后来他搬走了，走之前送你一本拉丁文入门语法，扉页写着："送给好奇的孩子。"',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b29', period:'before', places:['白银城'], name:'白银城的祈祷日', short:'祈祷日',
    text:'白银城每月有固定的祈祷日，全城人聚集在中央祭坛前，向"真实造物主"祈祷。你跟着人群跪下，吟唱古老的祷词。雷声在头顶滚过，祭坛上方的乌云裂开一道缝，一线天光照下来，落在祭坛的纹路上。首席说那是"回应"。你不太确定那是不是回应，但那一刻，你确实感觉到某种巨大的、温暖的注视落在你身上——只持续了一瞬，却让你浑身战栗。那天之后，你对祈祷变得格外虔诚。',
    reward:'信仰+2、理智-5', attr:{faith:2}, follow:null,
    battle:false, mandatory:false },
  { id:'b30', period:'before', places:[], name:'冬夜的炉火', short:'炉火',
    text:'最冷的冬夜，你们全家围坐在炉火边。父亲讲了几个老故事，都是关于"从前有座城沉到海底"之类的传说。母亲织着毛衣，偶尔插一句"别讲那些吓唬孩子"。你听得半睡半醒，忽然听见炉火里"啪"的一声爆响，火星溅出来，在地上排成一列——像一条指向门外的箭头。父亲怔了一下，用脚把那排火星扫平，若无其事地说："风大了。"第二天你发现，门口雪地上，有一串脚印，从门口一直延伸到看不见的远处，鞋底的花纹你从未见过。',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b31', period:'before', places:[], name:'废弃教堂的钟', short:'废教堂',
    text:'城郊有座废弃的教堂，钟楼已经歪了，但据说钟还会响——只在午夜响一声。你不信邪，半夜去听。你蹲在教堂外的树丛里等，等到钟声响起时，你看见钟楼顶层有一道模糊的白影，一动不动地"看"着下方。你大气不敢出。钟声过后，白影消失了。你悄悄离开，回头看了一眼——教堂二楼的彩窗后，似乎也有一双眼睛在看着你。从此你绕道走，但每次路过，你都会忍不住抬头看那扇彩窗。',
    reward:'勇气+1、神秘+1、理智-5', attr:{courage:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b32', period:'before', places:[], name:'猎人的馈赠', short:'猎人馈赠',
    text:'一位老猎人在山里救过你一次，你一直记着。后来他去世了，他的遗物里有一把做工考究的猎刀，刀刃泛着淡淡的蓝色光泽。他女儿把刀送给你，说："父亲说，这把刀给那个不怕黑的孩子。"你收下了。那把刀很锋利，切肉切铁都轻松。你用它防身，也用它削木头。有一次你用它削树枝时，刀锋划过自己的手指，血珠渗出来，你看见刀身上的蓝色光泽微微亮了一下——像是活的一样。',
    reward:'体质+1、幸运+1', attr:{constitution:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b33', period:'before', places:[], name:'流浪诗人的歌', short:'诗人',
    text:'镇上来了个流浪诗人，弹着旧琴唱些古怪的歌。有一首《沉没之城》，唱的是“海面下有座城，塔尖挂着铜钟，钟声一响，出海的人就回不了家”。你听得入神，问他这是真事吗。他笑了：“我唱过的歌，没有一首不是真事。”他走时，把歌词抄了一份给你：“留个念想——哪天你到了海边，替我听听那座城的钟，是不是真的会响。”你收下了那张纸，纸边微微卷曲，墨迹像是干了很多年。',
    reward:'神秘+1', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b34', period:'before', places:[], name:'失明的琴师', short:'琴师',
    text:'你常去听一位失明琴师拉琴。他的琴声像流水，听得人心里平静。有一回你问他："你看不见，怎么知道听众在哭还是在笑？"他笑了笑："听呼吸。"你沉默了一会儿，又问："那你见过光吗？"他沉默了很久，说："见过。我见过的最亮的光，是灰蒙蒙的——像雾，但比雾亮。那是一扇门，门后是海。"他说完又拉起琴来，没有再解释。你记住了那句话。很多年后你才明白，他说的可能不是"光"。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b35', period:'before', places:[], name:'雨夜的报童', short:'报童',
    text:'大雨夜，你碰见一个送报的小报童在屋檐下躲雨，浑身湿透。你分了他半块饼。他谢了你，忽然压低声音说："哥哥，我告诉你个秘密——我每天送报，路过第七街那栋黑房子时，总能听见里面有人哭。但那里明明没人住。"你随口说可能是风。他摇摇头："不是风，我听过风的哭声，不一样。"后来你路过第七街，那栋黑房子确实安静得像坟地。你特意绕进去看了一眼——门牌上落着厚灰，但门口的水渍，像是刚有人进出过。',
    reward:'幸运+1、理智-5', attr:{luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b36', period:'before', places:[], name:'药铺的学徒', short:'药铺',
    text:'你在药铺帮工，学了不少药理。老板是个古怪的老头，配药时总爱自言自语，说些"这味药招魂""那味药驱梦"的话。你当他是迷信。直到有一天，你按他的方子配了一副"安神茶"，喝下后梦见自己站在一片灰雾里，面前有一扇巨大的、青铜色的门。门没有开，但你清晰地感觉到了门后有什么东西在呼吸。你惊醒后去找老板，他只说："哦，你喝到那副方子了？年轻人少做点梦。"',
    reward:'智慧+1、神秘+1、理智-5', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b37', period:'before', places:[], name:'雪原上的脚印', short:'雪原脚印',
    text:'（北境）大雪封路，你随猎户进山。雪原上有一串脚印，从地平线那头延伸过来，绕过你们的营地，又消失在另一头。脚印巨大，足有你半个身子长，但每一步之间的距离却极近——像某种东西“走”得很慢，很小心。猎户的脸色不太好看，他低声说：“那是巡山人，别出声，别对视。”你们原地蹲到天黑，那串脚印没有靠近。第二天早上，脚印还在，但多了一行小的，像是什么东西跟着你们走了一路，又悄悄离开了。',
    reward:'勇气+1、神秘+1', attr:{courage:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b38', period:'before', places:[], name:'海边的漂流瓶', short:'漂流瓶',
    text:'你在海边捡到一个漂流瓶，里面塞着一张纸，纸上的字迹工整而古老，写着："第十七次漂流。塔尖上确实挂着钟。我听见它响了。别来，或者，准备好再来。"落款是一个画得很潦草的符号，像一只眼睛。你把纸折好收起来。老水手看了那张纸，脸色变了几变，最后只说了句："有些瓶子里装的是信，有些瓶子里装的是钩子。"他没有解释，你也再没捡到过第二个漂流瓶。',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b39', period:'before', places:[], name:'裁缝店的镜子', short:'镜子',
    text:'你陪母亲去裁缝店量衣服。店里的落地镜很旧，镜面有些发黄。你站在镜前整理领口时，忽然看见镜子里自己身后——一个穿着完全不同衣服的人，也在整理领口。你猛地回头，身后是墙。再看镜子，一切如常。你母亲问你发什么呆，你说了。裁缝老板听见了，笑了笑：“这镜子啊，是祖上传下来的，据说能照见另一个自己。别怕，它只会照，不会害人。”你没再照那面镜子。但那天回家后，你对着家里的镜子看了很久，怎么看，都觉得镜子里的人动作慢了半拍。',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b40', period:'before', places:[], name:'古董商的旧怀表', short:'旧怀表',
    text:'古董商的柜台上有一块旧怀表，表盖镂空，能看到里面的齿轮。你拿起来端详，发现表盘上的指针不是走正常的时间——它们在逆时针缓缓转动。古董商看你感兴趣，说：“这表啊，不走现在，走过去。戴它的人，能在梦里看见以前的事。”你问他多少钱，他报了个离谱的价。你放弃了。但之后好几晚，你都梦见那块怀表，表盘上的指针，一格一格地倒着走，而表盘玻璃上映出的脸，不是你。',
    reward:'神秘+1', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b41', period:'before', places:['白银城'], name:'白银城的无面者', short:'无面者',
    text:'白银城的集市上，你见过一个怪人：他的脸始终罩在灰色兜帽下，没人见过他的真容。老辈人叫他"无面者"，说他从城外来，在城里住了几十年，从不说话，也从不购买任何东西，只是每天在集市角落站一会儿。你有一回壮着胆子凑近，闻到一股陈旧的血腥味。兜帽下似乎有一双眼睛看了你一眼——那一眼让你浑身发冷。你退开了。从此你路过集市，都会刻意离他远一点。但夜里，你偶尔会梦见兜帽下的那张脸：没有五官，只有一片灰雾。',
    reward:'勇气+1、理智-10', attr:{courage:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b42', period:'before', places:[], name:'账房先生的算术', short:'算术',
    text:'你替账房先生核对粮税账目，发现一笔数目对不上——多出的钱够买一栋房子。你如实报告了。账房先生看完，沉默了很久，说："这笔账，你记在心里，别说出去。就说账平了。"你照做了。当夜，账房先生请你喝酒，席间他说："小伙子，算账容易，做人难。有些数字是给官府看的，有些数字是给良心看的。你今天做对了。"他给你的工钱里，悄悄多塞了一枚金币。',
    reward:'金钱+2、智慧+1', attr:{wealth:2, wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b43', period:'before', places:[], name:'马厩里的黑马', short:'黑马',
    text:'马厩新来了一匹黑马，性情暴烈，谁也不让骑。你偏不信邪，喂了它三天草料，慢慢靠近它。它打了个响鼻，但没有踢你。第七天，你翻身骑了上去，它疯跑了一圈，然后——安静了。养马人目瞪口呆，说这马是"从军队淘汰下来的"，据说它上一任主人死在了战场上，从此它谁也不认。你拍了拍黑马的脖子，它蹭了蹭你的手心。后来你每次去马厩，它都认得你，远远地就甩尾巴。',
    reward:'体质+1、勇气+1', attr:{constitution:1, courage:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b44', period:'before', places:[], name:'占星者的预言', short:'占星',
    text:'一位占星者在广场摆摊，你花了几个铜板让他看你手相。他捏着你的手看了半天，眉头越皱越紧，最后只说了句："你生命线分叉得很奇怪——你的人生里，会有一段时间"死"过一次。"你问什么意思，他摇头："说不清，可能不是真死。但你记住，那之后，你的命就变了。"你当他是故弄玄虚。但那天晚上，你第一次梦见自己站在灰雾里，面前有一扇青铜门，门缝里漏出微光。',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b45', period:'before', places:[], name:'丰收节的篝火', short:'篝火',
    text:'丰收节，全城人在广场点起篝火。你跟着跳舞、喝酒，火光把每个人的脸都照得通红。你喝得微醺，绕着篝火转圈时，忽然瞥见人群外站着一个身影——它没有影子，火光透过它照在地上，干干净净。你酒醒了大半，再看时，那个身影已经不见了。你问身边的人看见没，大家都说没有。第二天，你听人说，昨晚广场上"有东西来过"，驱邪的教士连夜在广场四角钉了银钉。',
    reward:'幸运+1、理智-5', attr:{luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b46', period:'before', places:[], name:'图书馆的守夜人', short:'图书馆',
    text:'你替图书馆守了一夜。后半夜，书架深处传来窸窸窣窣的声音，像翻书页。你举着油灯走过去，声音停了。你正要回去，余光瞥见一本摊开的书——你明明记得自己合上过。你走近一看，那本书摊开的那一页画着一扇门，门后是层层叠叠的楼梯，跟你上次在旧书里见过的几乎一模一样。你猛地合上书，快步走回值班室。天快亮时你才发现，你手心里捏着一枚钥匙，青铜的，齿形奇怪，不知道是哪扇门的。',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b47', period:'before', places:[], name:'磨坊的水车', short:'水车',
    text:'磨坊的水车年久失修，你帮忙修理。拆开轴承时，你在里面发现一截断了的链条，链条末端拴着一枚指环，青铜质地，刻着密密麻麻的细纹。你把它取下来擦干净，指环内侧刻着一行小字："守密者。"你不知为何没有上交，而是悄悄收了起来。戴上那枚指环后，你发现自己在夜里看东西格外清楚，连蚊虫振翅的轨迹都看得分明。你有点害怕，摘下来放进了木盒里。',
    reward:'体质+1、神秘+1', attr:{constitution:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b48', period:'before', places:[], name:'秋千上的女孩', short:'秋千',
    text:'村口的秋千上，你看见一个穿白裙的小女孩独自荡着。你走过去想陪她玩，她却忽然跳下秋千，跑进麦田里消失了。你追了几步，发现麦田里空无一人，只有风吹麦浪。回村后你问起，老人说，那秋千是"给早夭的孩子留的"，每年麦熟时节，会有人看见穿白裙的小女孩荡秋千。老人们叹了口气："她是在等人陪她玩呢。你看见她了？"你点点头，又摇摇头。那之后你路过秋千，都会停下来，把秋千轻轻荡两下，再离开。',
    reward:'信仰+1、理智-5', attr:{faith:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b49', period:'before', places:[], name:'铁匠的女儿', short:'铁匠女儿',
    text:'铁匠的女儿跟你差不多大，性格泼辣，能抡得动半个铁锤。你们从小一起长大。有一回她偷偷拿了她爹的猎刀带你去城外试刀，砍了半天的树桩。回来的路上她问你："你想过长大以后干什么吗？"你说没想过。她想了想，说："我想开一家自己的铁匠铺，打一把全世界最锋利的刀。"她看着你："到时候你来买，我半价卖你。"你笑了。很多年后你想起这句话，忽然觉得，那可能是你听过的最真诚的承诺。',
    reward:'勇气+1、金钱+1', attr:{courage:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b50', period:'before', places:[], name:'黎明前的钟声', short:'黎明钟声',
    text:'1349 年春天，你 18 岁前的最后几个月。某天黎明前，全城的钟忽然一起响了——不是报时的那种响法，而是急促、凌乱、像在报警。所有人被惊醒，冲到街上，却什么也没发生。天亮后，教堂宣布是"钟楼故障"。但你站在晨雾里，看见东边的天空，极短暂地亮了一下——像有什么巨大的东西，从那个方向掠过。你心里忽然冒出一个念头：这座城，这个时代，要变了。你攥紧了随身带着的那枚旧怀表，表盖上映着晨光。',
    reward:'幸运+1、神秘+1', attr:{luck:1, mystery:1}, follow:null,
    battle:false, mandatory:true },

  /* ===== 罗塞尔大帝时代（1125-1194，蒸汽与大革命的前夜）===== */
  { id:'r01', period:'roselle', places:[], name:'蒸汽与书页', short:'蒸汽书页',
    text:'这个时代的因蒂斯，蒸汽机车的汽笛声已经响彻城市。你的启蒙老师是一位退休的工程师，他教你的第一课不是字母，而是齿轮的咬合原理：“孩子，旧的时代靠魔法与祈祷，新的时代靠蒸汽与数学。”他书房里有一台黄铜做的模型蒸汽机，每天你都要给它上发条。你问他为什么会造这种东西，他沉默了很久：“因为有人告诉我，神也会老去，而机器不会。”你当时不懂，只是把那台模型擦得锃亮。',
    reward:'智慧+1、金钱+1', attr:{wisdom:1, wealth:1}, follow:'r01b',
    battle:false, mandatory:false },
  { id:'r01b', period:'roselle', places:[], name:'工程师的遗物', short:'遗物',
    text:'你的工程师老师去世了。他的遗物里有一本黄铜封皮的笔记本，扉页画着复杂的机械结构图，角落有一行小字：“献给那个问我神会不会老去的孩子。”你翻开笔记，里面除了机械图，还夹着一张泛黄的报纸——头条是“帝国皇帝罗塞尔·古斯塔夫宣布发明蒸汽机”，配图是一位戴皇冠、气质威严的男人。你盯着那张画像看了很久，忽然觉得，那双眼睛像是隔着岁月在看你。',
    reward:'智慧+2、神秘+1', attr:{wisdom:2, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r02', period:'roselle', places:[], name:'革命者的地下印刷所', short:'印刷所',
    text:'这个时代的空气里飘着不安。你偶然发现邻居的地下室里有一间印刷所，油墨味混着蜡烛味，几个人连夜印刷传单，上面写着“自由”“平等”“打倒暴君”之类的字眼。你被他们发现时，领头的高个子没有为难你，只是让你发誓保密。你发了誓。后来你才知道，他们印的传单，传遍了半个因蒂斯——而在那之后不久，大革命的风暴就真的来了。',
    reward:'勇气+1、金钱+1', attr:{courage:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r03', period:'roselle', places:['特里尔','里昂','伦堡'], name:'皇冠下的阴影', short:'皇冠阴影',
    text:'你在街头见过一次皇帝的车驾。罗塞尔大帝的车队经过时，全城的人都跪下了，你也被母亲按着跪下。你偷偷抬头，看见车帘掀开一角，露出一张威严的脸——那一眼很短，但你记住了那双眼睛。夜里你问父亲，皇帝是什么人？父亲压低声音：“据说他能做到神才能做到的事。”你又问，那他是神吗？父亲沉默了很久：“不，据说他自己说，他只是一个人。但这世上，没有人敢信。”',
    reward:'信仰+1、神秘+1', attr:{faith:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r04', period:'roselle', places:[], name:'殖民地的来信', short:'来信',
    text:'你的一位远亲在南大陆的殖民地经商，每隔几个月会寄来一封信。信里写着异域的见闻：巨大的废墟、皮肤黝黑的奴隶、信奉神秘神祇的部落。有一封信的末尾，他潦草地写着：“这里的人们说，海的那边住着一位被缚的神。他教会了我们很多，但我们不知该感谢他还是害怕他。”你把这封信抄了一份收起来。后来，那位远亲的信就再也没来过。',
    reward:'神秘+1、金钱+1', attr:{mystery:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r05', period:'roselle', places:[], name:'铁轨上的孤儿', short:'铁轨孤儿',
    text:'蒸汽机车刚刚通车的那年，你跟着父亲坐了一趟“会跑的铁房子”。车轮碾过铁轨的声音让你又怕又兴奋。中途停车加水时，你看见一个衣衫褴褛的男孩趴在轨道边，羡慕地看着车头冒出的白烟。你分了他半块面包。他一边啃一边问你：“听说坐着这个，能去海的那边？”你点头。他眼睛亮了一下：“那我以后也要去。”蒸汽机车重新启动时，你回头看了一眼，那个男孩还站在原地，朝你挥着手。',
    reward:'金钱+1、信仰+1', attr:{wealth:1, faith:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r06', period:'roselle', places:[], name:'戴假发的学者', short:'假发学者',
    text:'这个时代流行戴假发。你在一场沙龙外偷听学者们辩论：有人主张“一切皆可用数学解释”，有人说“灵魂比齿轮更真实”。你听得入迷，直到一位戴假发的学者发现了你。他没有赶你走，反而递给你一本书：“孩子，记住——辩论的尽头不是真理，而是谦卑。”你翻开那本书，扉页写着他的名字。多年后你才知道，他是因蒂斯最著名的数学家之一，而那本书，后来被列入禁书。',
    reward:'智慧+1、幸运+1', attr:{wisdom:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r07', period:'roselle', places:['海上·风暴群岛','普利兹港'], name:'帆船上的水手长', short:'水手长',
    text:'蒸汽机取代帆船的风声传遍港口，老水手们却大多不信。你混上一条旧帆船帮忙，水手长是个满脸刀疤的老头，他教你打绳结、看风向。他说：“蒸汽船跑得快，但快的东西，都活不长。”你问他为什么，他指着海面：“海是有脾气的，它喜欢慢悠悠的东西。”船出港那天，你远远看见一艘冒着黑烟的蒸汽船从旁边驶过，水手长啐了一口唾沫，但你也看见，他眼里有一丝说不清的东西。',
    reward:'体质+1、金钱+1', attr:{constitution:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r08', period:'roselle', places:[], name:'月光下的占卜师', short:'月光占卜',
    text:'这个时代，占卜依然是犯忌讳的。但总有人偷偷摆摊。你花了一个铜板，让一位老占卜师看你的掌纹。她看了很久，忽然说：“你的命很硬，但也很苦。你会活过很多场灾难——而每一次，你都会在最后一刻找到一条活路。”你问她凭什么这么肯定。她眯起眼：“因为你的掌纹里，有一条线是后来才长出来的。有人替你改过命。”你追问是谁，她却怎么也不肯说了。你离开时，她叫住你，补了一句：“记住，欠的命，迟早要还。”',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r09', period:'roselle', places:[], name:'王宫外的卫兵', short:'卫兵',
    text:'你随父亲去首都办事，路过王宫时，看见卫兵们列队换岗，盔甲擦得雪亮。一个年轻卫兵看见你盯着他，咧嘴笑了笑，从口袋里摸出一颗糖给你。你问他当兵好不好，他说：“好啊，管吃管住，就是偶尔要站一整夜。”你问他怕不怕打仗，他沉默了一下，说：“怕。但有些事情，总得有人去做。”多年后，你听说那位年轻卫兵死在了战场上——为了一座城，或为了一位皇帝，没有人说得清。',
    reward:'勇气+1、信仰+1', attr:{courage:1, faith:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r10', period:'roselle', places:[], name:'暴风雨夜的灯塔', short:'灯塔',
    text:'一场百年不遇的暴风雨袭击了海岸。你躲在旅馆里，听见海面传来断断续续的钟声——那是灯塔在报警。天亮后，人们发现一艘商船触礁沉没，只有三个水手活了下来。他们说，是灯塔的光救了他们。但你注意到，那盏灯塔，前一晚明明没有亮过。你把这件事说给旅馆老板听，老板脸色一变：“别乱说。那灯塔，十年前就废弃了。”你看向窗外——那盏废弃的灯塔，此刻正静静地立在海岬上，窗户黑洞洞的。',
    reward:'勇气+1、神秘+1', attr:{courage:1, mystery:1}, follow:null,
    battle:false, mandatory:false },

  /* ===== 克莱恩时期（1349-1352，旧神与新神交替的剧变时代）===== */
  { id:'k01', period:'klein', places:[], name:'雾中的新消息', short:'新消息',
    text:'这个时代的报纸，每天都在刊登怪事：某座城市一夜之间消失了半个街区、海面上出现会唱歌的巨影、一位“愚者”的信徒在人群中传播新的祷词。你生活的城市也被这种不安笼罩。你路过报摊时，卖报的小贩压低声音对你说：“听说北边出了大事，死了很多人，但教会说只是瘟疫。”他顿了顿，又说：“可我不信。瘟疫不会让人笑着死。”你买了一摞旧报纸，把那些“怪事”一条条剪下来，收进了木盒。',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:'k01b',
    battle:false, mandatory:false },
  { id:'k01b', period:'klein', places:[], name:'旧报纸的拼图', short:'旧报拼图',
    text:'你把剪下的旧报纸摊在桌上，拼凑那些“怪事”的线索。你发现一个规律：每一条怪事，都发生在“月亮升起的时候”，而且都有人提到“灰色的雾气”。你夜里翻来覆去睡不着，爬起来在纸上画了一条线，把那些城市连起来——它们连成了一条诡异的曲线，像一条蛇，又像一个符号。你盯着那个符号看了很久，忽然打了个寒颤：这个符号，你好像在哪本书里见过。但你翻遍书架，也没找到那本书。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k02', period:'klein', places:[], name:'值夜者来了', short:'值夜者',
    text:'一位自称“值夜者”的中年人敲开了你家的门。他穿着朴素，眼神却很锐利，他问你是否见过“不正常的事”。你犹豫了一下，把旧报纸的事说了。他听完，没有笑，只是点了点头：“小孩，你比大多数人聪明。记住——如果你真的看见了什么，不要自己处理，来找我们。”他留给你一张纸条，上面只有一个地址。他走后，你母亲问你那是谁，你说是“巡夜的”。但你知道，那不是普通的巡夜人。',
    reward:'勇气+1、神秘+1', attr:{courage:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k03', period:'klein', places:['贝克兰德','廷根市'], name:'雾都的呼吸', short:'雾都呼吸',
    text:'你跟着商队去了一趟大城市。这座城市笼罩在灰蒙蒙的雾气里，人们戴着口罩匆匆行走，谈论着“大雾霾”和“死去的贵人”。你在一家咖啡馆听到两个绅士低声交谈：“听说那位‘愚者’先生，能从灰雾之上俯瞰世界。”“嘘！别乱说那个名字！”你端着杯子，假装没听见，心里却记住了那个名字。离开那天，你在城门口回头看了一眼——整座城市都埋在灰雾里，像一只蜷缩的巨兽。',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k04', period:'klein', places:[], name:'塔罗牌与陌生人', short:'塔罗牌',
    text:'你在旧货摊上买过一副塔罗牌，一直没怎么用。这天，一位穿斗篷的陌生人忽然在你面前坐下，问你能不能给他算一卦。你笨拙地洗牌、抽牌，抽出的第一张是“愚者”。陌生人沉默了很久，说：“有意思。他也在牌里。”你问他“他”是谁，陌生人摇摇头，站起来走了。你低头看那张牌——牌面上，一个戴礼帽的人影正走在悬崖边。你莫名觉得，那张牌好像在对你微笑。',
    reward:'神秘+2、理智-5', attr:{mystery:2}, follow:null,
    battle:false, mandatory:false },
  { id:'k05', period:'klein', places:[], name:'战场归来的舅舅', short:'舅舅',
    text:'战争结束了，你的舅舅从战场上归来，少了一条胳膊。他很少说话，常常坐在院子里盯着天空发呆。有一回你问他，战场上最可怕的是什么。他想了很久，说：“不是子弹，不是炮弹——是某个晚上，整条战壕的人，忽然一起停止了呼吸。第二天早上，他们又一起开始呼吸了，像什么都没发生过。”他顿了顿：“但我知道，那晚他们中间，有一个已经不一样了。”你没有再问，只是陪他坐了很久。',
    reward:'勇气+1、理智-5', attr:{courage:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k06', period:'klein', places:['白银城'], name:'灰雾之上的新神', short:'灰雾新神',
    text:'白银城变天了。老祭司们在祭坛前争吵，说城里来了“新的声音”，说那位灰雾之上的存在，给绝望的人们带来了光。你挤在人群里，看见一个年轻人站在祭坛台阶上，他的眼睛里没有疯狂，只有一种平静的光。他开口时，声音不大，却压过了所有争论：“我们不再向黑暗祈祷。”人群沉默了。你看见，老祭司们颤抖着，第一次没有反驳。那天之后，白银城的祷词，变了。',
    reward:'信仰+2、理智-10', attr:{faith:2}, follow:null,
    battle:false, mandatory:false },
  { id:'k07', period:'klein', places:[], name:'海上的黑旗', short:'黑旗',
    text:'你站在港口，看着一艘挂着黑帆的船缓缓靠岸。船头站着一个戴三角帽的男人，他跳上岸时，整个人像一片羽毛一样轻——没有人看到他是怎么从甲板跳到码头的。他在你面前停住，低头看你：“小孩，你知道‘愚者’的信徒在哪条街吗？”你摇头。他笑了笑：“那你知道，怎么在海上活下来吗？”你还是摇头。他递给你一枚银币：“那这个你拿着——下次见到黑帆船，别害怕。”',
    reward:'勇气+1、幸运+1', attr:{courage:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k08', period:'klein', places:[], name:'消失的教堂', short:'消失教堂',
    text:'你每天上学都要路过一座老教堂。这天早上，你路过时愣住了——教堂不见了。原地只剩一片空地，连地基都干干净净，像从未存在过。你揉揉眼睛，确实不见了。路过的行人却都若无其事，没有人注意到那里少了一座建筑。你拉住一个路人问：“这里的教堂呢？”那人奇怪地看着你：“教堂？这里从来就没有教堂啊。”你站在原地，后背发凉。那天下午你再去，教堂又在那里了——像什么都没发生过。',
    reward:'神秘+1、理智-10', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k09', period:'klein', places:[], name:'会说话的乌鸦', short:'乌鸦',
    text:'一只黑色的乌鸦最近总停在你家窗台上。它不怕人，歪着脑袋看你，眼睛里有一种近乎人类的审视。你试着喂它，它叼走面包屑，却从不吃，只是把面包屑攒在窗台上。有一回你梦见自己站在灰雾里，那只乌鸦落在一个戴礼帽的男人肩上，男人低头看你，什么也没说。你惊醒后冲到窗边——乌鸦还在，正静静地看着你。它张开嘴，发出一个沙哑的音节，听起来像是：“来。”',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k10', period:'klein', places:[], name:'雾里的钟楼', short:'雾里钟楼',
    text:'城里的钟楼在浓雾天显得格外朦胧。你爬上钟楼顶，想看看雾里的城市，却在钟楼角落发现一个蜷缩的身影——一个老人，裹着破旧的斗篷，怀里抱着一只黄铜怀表，已经死了很久。你报了警。巡警检查后说，老人身上没有任何身份证明，只有怀表里夹着一张照片：照片上是一个年轻男人，站在灰雾里，戴着一顶礼帽。你盯着那张照片看了很久——你总觉得，照片里的男人，好像下一秒就会转过头来。',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k11', period:'klein', places:[], name:'失控的敲门人', short:'敲门人',
    text:'深夜，有人敲你家的门，一下、两下、三下，不紧不慢。你从门缝里看出去——门外站着一个面色青灰的陌生人，他的眼睛没有焦距，嘴角却挂着一种诡异的微笑。他开口说：“让我进去，我是你远房叔叔。”你根本不认识他。你想关门，却发现门像被什么东西钉住了一样纹丝不动。你抄起门后的铁棍，冲他吼道：“走开！”他歪了歪头，忽然咧嘴——嘴里密密麻麻的牙齿，比常人多了一倍。他朝门扑了过来，你死死抵住门板，直到天亮前，那东西才像雾气一样散去了。',
    reward:'勇气+1、理智-10', attr:{courage:1}, follow:null,
    battle:true, enemySeq:8, enemyName:'失控的非凡者', enemyPath:'秘祈人',
    mandatory:false },

  /* ===== 愚者教会建立初期（1353 后，新神信仰扩散）===== */
  { id:'f01', period:'fool', places:[], name:'街角的传单', short:'传单',
    text:'这个时代，街头多了一种新的传单——灰底、黑字，印着一扇半开的门和一轮看不清的月亮。传单上说，灰雾之上有一位愚者，祂怜悯迷途者，也注视深渊。大多数人对传单嗤之以鼻，但总有人在夜深人静时，把传单悄悄揣进怀里。你捡起一张被风吹到脚边的传单，翻到背面，发现上面有一行手写的小字：“如果你看见这行字，说明你在找门。星期四午夜，老码头第七根灯柱下。”',
    reward:'神秘+1、信仰+1', attr:{mystery:1, faith:1}, follow:'f01b',
    battle:false, mandatory:false },
  { id:'f01b', period:'fool', places:[], name:'第七根灯柱', short:'灯柱',
    text:'星期四午夜，你鬼使神差地去了老码头。第七根灯柱下，站着一个戴兜帽的人。他看见你，没有惊讶，只说了一句：“第一次来？”你点头。他递给你一枚暗银色的徽章，徽章上的图案和传单上一样：一扇半开的门。“戴上它，愚者会看见你。”他顿了顿，“但也意味着，从此你不能再假装看不见祂。”你攥着徽章，在码头站了很久。月亮很亮，海风很咸，你听见自己心跳的声音，很响。',
    reward:'信仰+2、神秘+1', attr:{faith:2, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f02', period:'fool', places:[], name:'新教堂的钟', short:'新教堂',
    text:'城里新开了一间“愚者教堂”——没有高耸的尖塔，没有彩窗，只有一间朴素的大厅，墙上挂着一幅简素的油画，画上是海与帆船。来这里祈祷的人形形色色：有贵族，有乞丐，有海盗，也有学者。你跟着人流走进大厅，看见一位年轻的祭司正在布道，他说：“我们不信奉盲目的神，我们信奉真理与勇气。”你站在人群里，忽然觉得，这间朴素的教堂，比那些金碧辉煌的殿堂，更有某种让人安心的东西。',
    reward:'信仰+1、勇气+1', attr:{faith:1, courage:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f03', period:'fool', places:[], name:'白银城的信使', short:'信使',
    text:'你遇见一位来自远方的信使，他的皮肤上有雷暴留下的疤痕，说的是生硬的通用语。他说他来自“白银城”——一座被神遗弃又重获光的城市。他给你看一枚粗糙的银币，上面刻着闪电与城墙。“我们以前只向黑暗祈祷，”他说，“现在，我们向光祈祷。”他问你愿不愿意帮他送一封信，报酬是一枚这种银币。你答应了。信很轻，但你总觉得，它承载的东西很重。',
    reward:'金钱+1、信仰+1', attr:{wealth:1, faith:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f04', period:'fool', places:[], name:'海上的雾影', short:'海雾',
    text:'你跟着一艘商船出海，遇上了罕见的灰白浓雾——不是普通的海雾，雾里没有水汽的湿润，反而干燥得像沙漠。船长脸色大变，命令所有人回舱，只留你一个孩子在甲板上（你偷偷藏起来的）。雾里，你隐约看见一艘巨大的、古老的帆船缓缓驶过，船身覆满藤壶，桅杆上挂着残破的帆。船头站着一个身影，他似乎在看你。你死死捂住嘴。雾散去后，甲板上多了一枚灰白色的贝壳，你捡起来，贝壳内侧刻着一扇半开的门。',
    reward:'神秘+2、幸运+1', attr:{mystery:2, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f05', period:'fool', places:[], name:'雾灯书店', short:'雾灯书店',
    text:'城里开了一间奇怪的书店，门面很小，门口挂着一盏长明的旧雾灯。老板是个戴眼镜的瘦高男人，他卖的书五花八门：有数学、有历史、有小说，也有几本封面空白的“无字书”。你问他无字书怎么读，他笑了笑：“等你读得懂的时候，字自然会出现。”你买了一本便宜的旧诗集。回去的路上你翻开——扉页上，多了一行刚才绝对没有的字：“欢迎回来，孩子。”',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f06', period:'fool', places:[], name:'废墟里的圣坛', short:'圣坛',
    text:'城外的旧废墟里，有人搭了一座简陋的圣坛——几块石头垒成，上面放着一只青铜碗，碗里盛着清水。路过的老人说，这是给“愚者”的供桌，祭拜者不求富贵，只求“清醒地活着”。你路过时，一个衣衫破旧的妇人正在祷告，她低声说：“求您让我今晚不要梦见那些东西。”你站在远处，没有上前。你忽然明白，这世上大多数人信神，不是因为爱，而是因为怕——怕黑暗里的东西，怕梦见的东西，怕那些说不清的东西。',
    reward:'信仰+1、理智-5', attr:{faith:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f07', period:'fool', places:[], name:'会敲门的报童', short:'报童',
    text:'愚者教会的传单越印越多，连报童都开始兼职派发。你常买报的那个报童忽然神秘兮兮地凑近你：“哥哥，我告诉你个秘密——我派传单的时候，发现有条街的住户，每个星期四晚上都会同一时间熄灯。你说他们在干嘛？”你随口说：“睡觉呗。”他摇摇头：“睡觉能睡出钟声吗？我听见了，每个星期四半夜，那条街都有钟声，可那里根本没有教堂。”你记住了那条街的名字。后来的星期四，你特意绕到街口听了一会儿——风很大，什么也没听见。但你总觉得，那钟声真的存在过。',
    reward:'幸运+1、神秘+1', attr:{luck:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f08', period:'fool', places:[], name:'新式魔药', short:'新魔药',
    text:'坊间开始流传一种说法：愚者教会愿意给“有缘人”提供魔药配方，只要你能证明自己心智足够坚定。酒馆里有人吹嘘自己喝过“序列九的魔药”，代价是连续失眠三个月。你听得半信半疑。直到有一天，你亲眼看见一个原本懦弱的少年，喝下一杯深色的液体后，眼神变得像鹰一样锐利——他站在阳光下，影子却淡了一分。你记住了那杯液体的颜色：像夜色沉淀后，剩下的那一点深蓝。',
    reward:'神秘+2、理智-10', attr:{mystery:2}, follow:null,
    battle:false, mandatory:false },
  { id:'f09', period:'fool', places:[], name:'被祝福的孤儿院', short:'孤儿院',
    text:'城郊的孤儿院收留了很多战争孤儿。奇怪的是，这家孤儿院的孩子们都格外安静、格外懂事，脸上有一种超乎年龄的平静。院长是一位温和的中年女士，她说：“我们教他们读书、算术，也教他们——不要害怕。”你问她孩子们为什么这么安静，她想了想，说：“因为他们见过真正的恐惧，所以学会了珍惜平静。”你离开时，一个五六岁的小女孩拉住你的衣角，仰头看着你，认真地说：“大哥哥，你不要怕。命运会护着你的。”',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f10', period:'fool', places:[], name:'圣典初刊', short:'圣典初刊',
    text:'城里的印刷厂印出了第一批《愚者圣典》——薄薄一册，封面只有一行烫金的字，扉页上印着建会的年月。领书的人在教堂门口排成长队：有虔诚的信徒，有好奇的学者，也有撇嘴的怀疑者。你领到一册，翻开第一页，上面写着：「不要害怕未知，因为未知亦有规律；不要沉溺已知，因为已知终将陈旧。」你合上书页，听见身后一个老人轻声说：「教会立起来了。从今往后，这世上的信仰，又多了一座灯塔。」你忽然意识到，自己正站在一个新时代的开端——一个属于愚者的时代。',
    reward:'信仰+1、智慧+1', attr:{faith:1, wisdom:1}, follow:null,
    battle:false, mandatory:true },
  /* ---- 克莱恩时期扩充（k12-k21） ---- */
  { id:'k12', period:'klein', places:['廷根市'], name:'黑荆棘的招聘启事', short:'招聘启事',
    text:'廷根的“黑荆棘安保公司”在《廷根晨报》上刊登了一则招聘启事：诚聘文员一名，要求识文断字、品行端正，待遇从优。你路过报摊时多看了两眼。摊主压低声音说：“这家公司呀，白天是安保公司，夜里不知道做什么——雇的人一个比一个年轻。”你想了想，没有去应聘。可那则启事，你记了很久。后来你听说，一个姓克莱恩的年轻人去做了夜班登记员。',
    reward:'幸运+1', attr:{luck:1}, follow:'k12f',
    battle:false, mandatory:false },
  { id:'k13', period:'klein', places:['贝克兰德'], name:'廉价歌剧院的夜', short:'歌剧院',
    text:'贝克兰德西区有一家廉价的歌剧院，票价三便士，包厢里却常常坐着身份不明的人物。你花三便士挤进大厅，台上正在演一出老掉牙的《王国与海盗》。演到一半，楼上包厢忽然传来一声闷响——有人摔碎了杯子。紧接着，一个披斗篷的身影快步离开，身后跟着两个穿黑衣的人。散场时，你在座位底下捡到一枚银制胸针，正面刻着一只乌鸦。你把它收进口袋。后来你才知道，那晚包厢里谈崩的，是一场关乎半个城市的交易。',
    reward:'神秘+1、金钱+1', attr:{mystery:1, wealth:1}, follow:'k13f',
    battle:false, mandatory:false },
  { id:'k14', period:'klein', places:[], name:'塔罗牌的流行', short:'塔罗流行',
    text:'不知从什么时候起，塔罗牌在年轻人中间流行起来——不是为了占卜，而是因为有人传说，真正的塔罗师能“看见不一样的东西”。街角新开了好几家占卜摊，摆摊的姑娘们戴着面纱，煞有介事地洗牌、翻牌。你花一枚铜便士抽了一张：倒吊人。摆摊的姑娘看了你一眼，忽然把铜币推回来，低声说：“这张牌不收钱。你最近……别往水边去。”你愣在原地，她却已经招呼下一位客人了。',
    reward:'神秘+1', attr:{mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k15', period:'klein', places:[], name:'战争动员令', short:'动员令',
    text:'城里贴出了战争动员令：王国与邻国因殖民地争端开战，征兵令下达到各郡。街上有人欢呼，有人沉默，有人连夜收拾细软离开。你看见一对夫妻在征兵处门口拉扯——丈夫执意要报名，妻子死死拽着他的袖子，哭得说不出话。你帮那位妻子把丈夫拉回了家。那天晚上，你听见隔壁传来压抑的哭声。第二天清晨，那家的男人还是去了征兵处。你站在门口，看着他的背影消失在晨雾里。',
    reward:'勇气+1、理智-5', attr:{courage:1}, follow:'k15f',
    battle:false, mandatory:false },
  { id:'k16', period:'klein', places:[], name:'蒸汽列车的新线', short:'新铁轨',
    text:'王国第一条跨郡的蒸汽铁路通车了，喷着白汽的钢铁巨兽第一次驶过你的家乡。全村人都去铁轨边看热闹，老人念叨着“铁牛会带来灾祸”，孩子则追着列车跑出好几里地。你挤到最前面，看见车窗里坐着形形色色的人：戴礼帽的绅士、抱孩子的妇人、闭目养神的教士。列车呼啸而过时，你看见第三节车厢的窗帘后，站着一个看不清面孔的人，正隔着玻璃注视着你。等你想再看时，列车已经驶远，只留下铁轨上久久不散的白汽。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:'k16f',
    battle:false, mandatory:false },
  { id:'k17', period:'klein', places:['廷根市'], name:'占卜家俱乐部', short:'占卜俱乐部',
    text:'廷根有一家挂羊头卖狗肉的“占卜家俱乐部”：门面写着出售茶叶与咖啡，后院却常有人深夜进出。你曾好奇地溜进后院，看见有人对着水晶球念念有词，有人把玩着一副镀金塔罗牌，还有人小心翼翼地擦拭一只青铜天平。一个戴单片眼镜的老先生看见你，笑着招招手：“孩子，想不想测一测未来的运势？”你鬼使神差地坐下。他看了你很久，最后只说了句：“你命里有一道坎，坎上站着一只乌鸦。过了，海阔天空。”',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:'k17f',
    battle:false, mandatory:false },
  { id:'k18', period:'klein', places:[], name:'黑市的日记残页', short:'日记残页',
    text:'黑市上流传着几页据说是罗塞尔大帝亲笔所写的日记残页，上面是无人能解的符号。有人出高价收购，据说研究这些符号的学者发了疯。你路过黑市时，看见一个衣衫褴褛的老人举着一页泛黄的纸叫卖：“三个金币！看了能改命！”没人搭理他。你鬼使神差地多看了那页纸一眼——上面的符号你好像在哪里见过，却怎么也想不起来。老人见你看他，忽然咧嘴一笑，把纸页卷起来塞进怀里，低声道：“认字的人，别沾这个。三个金币买的不是命，是麻烦。”',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:'k18f',
    battle:false, mandatory:false },
  { id:'k19', period:'klein', places:[], name:'南下的船票', short:'南下船票',
    text:'战争让北边的港口乱成一团，通往南方港口的船票成了紧俏货。你帮码头一位老船工搬运货物，换来了半天的等待时间，亲眼看见售票窗口前排起的长龙。一个商人模样的中年男人买下最后三张票，转身却被两个黑衣人拦住了去路：“先生，麻烦借一步说话——有人想买你的票。”商人脸色煞白。你抱着货物从他们身边经过时，听见那商人颤抖着说：“票、票可以给，但我要见你们主人。”你忽然觉得，这座城市的暗处，藏着比战争更深的水。',
    reward:'金钱+1、神秘+1', attr:{wealth:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'k20', period:'klein', places:[], name:'夜半的哭声', short:'夜半哭声',
    text:'邻街搬来一户新邻居，可那家的孩子每到半夜就哭，哭声又尖又细，像猫叫，又像婴儿。街坊们上门问过，主人只说孩子认床。你睡不着，半夜起身，听见那哭声忽然停了——取而代之的，是一阵极轻的、像指甲刮过木板的声响。第二天清晨，你看见一辆黑色马车停在那户人家门口，车上下来两个穿制服的人，胸前别着徽章。他们进去不到一刻钟，就抬着一只盖白布的担架出来。从此那户人家再没亮过灯。街坊们都说，那家人搬走了。可你总觉得，那晚刮木头的声音，不像是人能发出的。',
    reward:'神秘+2、理智-10', attr:{mystery:2}, follow:'k20f',
    battle:false, mandatory:false },
  { id:'k21', period:'klein', places:[], name:'愚者的名讳', short:'愚者名讳',
    text:'不知从哪一天起，坊间开始流传一个奇怪的名号——“愚者”。有人说那是一位通晓古今的大人物，有人说那是一个神秘组织的代号，还有人压低声音说，那位“愚者”能看见命运。酒馆里有人喝多了，大声嚷嚷“愚者算什么，我见过——”话没说完，就被同伴一把捂住嘴，拽出了酒馆。你看见捂他嘴的那个人，袖口绣着一枚暗银色的徽章。从此你记住了一件事：有些名字，可以听，但最好别说出口。',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null,
    battle:false, mandatory:false },
  /* ---- 罗塞尔大帝时期扩充（r11-r20） ---- */
  { id:'r11', period:'roselle', places:[], name:'码头的蒸汽吊机', short:'蒸汽吊机',
    text:'大帝推行蒸汽革新后，港口装上了第一台蒸汽吊机。铁铸的巨臂发出轰鸣，把一箱箱货物从船腹提起，码头工人仰着头看得发呆——从前十几个人一天搬不完的货，如今一台机器半个时辰就干完了。你挤在人群里，看见一个穿着崭新工装、胸前别着帝国勋章的男人站在吊机旁，正对围观的人大声宣讲：“这就是大帝说的——用钢铁与蒸汽，取代血肉与汗水！”人群里响起稀稀拉拉的掌声。你身后一个老水手低声嘟囔：“机器不会喝酒，也不会心疼人。”',
    reward:'智慧+1', attr:{wisdom:1}, follow:'r11f',
    battle:false, mandatory:false },
  { id:'r12', period:'roselle', places:[], name:'王宫花园的灯火', short:'王宫灯火',
    text:'大帝的生日，王宫花园彻夜灯火通明。你作为仆人家里的孩子，得以混在侍从队伍里远远望一眼。花园里摆着长桌，桌上堆满你看也没见过的食物；贵族们穿着繁复的礼服，像一群孔雀一样走来走去。你听见两个侍从低声交谈：“听说大帝今晚要宣布一件大事——关于远洋的。”“远洋？去南大陆？”“不，比那更远。听说是……西边，一片新的大陆。”你还没来得及听清，一个胖管家就厉声把你们轰走：“去去去！贵人们的事，是你们能听的？”你回头望了一眼灯火，觉得大帝的时代，正在把整个世界推向某个未知的方向。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:'r12f',
    battle:false, mandatory:false },
  { id:'r13', period:'roselle', places:[], name:'被劫的商船', short:'商船被劫',
    text:'帝国的商船在间海被海盗劫了，消息传回港口，码头顿时炸开了锅。货主们捶胸顿足，水手们连夜打听下一班船还敢不敢出海。你在码头看见一个年轻的船长站在自家船头，指着桅杆大声说：“海盗也是人，怕死的都跟我干！我这条船，装上火炮，看谁敢来抢！”人群里响起一阵欢呼，可你看见他攥着缆绳的手，指节发白。晚上，你听母亲说，那位船长第二天还是出海了，船上多装了四门炮，也多了二十个扛着猎枪的壮汉。',
    reward:'勇气+1', attr:{courage:1}, follow:'r13f',
    battle:false, mandatory:false },
  { id:'r14', period:'roselle', places:[], name:'大帝的秘密日记', short:'秘密日记',
    text:'宫里流传着一个说法：大帝每天深夜都要伏案书写，用的是一种没人能认出的符号。有人说那是天书，有人说那是大帝在与神明对话，还有人说——那只是大帝在记录每天的食谱。你认识一个给宫里送纸的商人，他偷偷告诉你：“那纸呀，是特制的，又厚又韧，我送去的时候，看到上面画满了奇怪的方框和线条。”他神神秘秘地压低声音：“我听说，大帝写的东西，将来是要留给后人的——他说，那会比他的剑更有力量。”你似懂非懂，却把那句话记住了。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:'r14f',
    battle:false, mandatory:false },
  { id:'r15', period:'roselle', places:[], name:'远洋移民的招募', short:'移民招募',
    text:'帝国的告示栏上贴出了远洋移民的招募令：凡自愿前往新殖民地者，每户可获土地三十亩，免税五年，还发一笔安家费。告示前围满了人，有人心动，有人犹豫，有人骂骂咧咧：“三十亩地换一条命？殖民地那地方，听说瘴气能毒死人！”你挤在人群里，看见一个年轻夫妇站在告示前，妻子怀里的婴儿正在哭。丈夫咬了咬牙：“去！与其在这里给人扛一辈子活，不如去搏一把！”三天后，你看见他们背着包袱，挤上了驶向港口的马车。你忽然觉得，大时代的浪潮，正把无数人卷向远方。',
    reward:'金钱+1、勇气+1', attr:{wealth:1, courage:1}, follow:'r15f',
    battle:false, mandatory:false },
  { id:'r16', period:'roselle', places:[], name:'蒸汽教会与知识教会', short:'双教会',
    text:'大帝时代，蒸汽与机械之神教会和知识教会明里暗里较劲：一个说“钢铁是文明的脊梁”，一个说“知识是永恒的火种”。城里的两条主街上，两家教会各自建起气派的殿堂，信徒们各站一边。你路过时，正撞见两个年轻教士当街辩论——一个指着蒸汽列车说“这是神启”，另一个指着图书馆说“这是真理”。围观的人越来越多，最后两个教士都被各自的教长揪着耳朵拎走了。你站在街角，看着两家教堂尖顶在夕阳下对峙，忽然觉得，这世上的信仰，从来不止一种。',
    reward:'信仰+1、智慧+1', attr:{faith:1, wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r17', period:'roselle', places:[], name:'骑士比武大会', short:'比武大会',
    text:'大帝在都城举办骑士比武大会，消息传遍四境。比武那天，你混在人群里挤到最前面：骑士们穿着锃亮的盔甲，骑着高头大马，在场地中央对冲、交锋，长枪折断的脆响此起彼伏。你记住了一个棕发骑士——他连赢三场，最后一场被对手挑飞了头盔，露出年轻而张扬的脸。他翻身下马，朝着看台单膝跪地。看台上，大帝的旗帜招展。你听见身边的老兵啧啧赞叹：“那小子，像极了年轻时候的大帝。”后来你才知道，那个棕发骑士，后来成了大帝麾下最年轻的舰队长。',
    reward:'勇气+1、体质+1', attr:{courage:1, constitution:1}, follow:'r17f',
    battle:false, mandatory:false },
  { id:'r18', period:'roselle', places:[], name:'新历法的第一天', short:'新历法',
    text:'大帝推行新历法，旧历的最后一天被抹去，全国在同一天迎来“新纪元年”。那天清晨，城里的钟楼同时敲响，人们推开窗，看见教堂门口贴出告示：今天是新历元年一月一日。有人欢呼，有人茫然，有人站在旧历的坟前抹眼泪——旧历的最后一天没了，有些人的生辰、忌日，也跟着消失了。你听见一个老人站在告示前喃喃自语：“连日子都是他说了算……这个大帝，比神还神。”旁边有人接话：“可不就是神么——他连海都敢去踩。”你忽然觉得，自己正活在一个被一个人改变的时代里。',
    reward:'智慧+1', attr:{wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'r19', period:'roselle', places:[], name:'家乡的新灯塔', short:'新灯塔',
    text:'帝国在大陆沿海建起了一连串灯塔，你的家乡也分到了一座。灯塔落成那天，全城的人都来看：白色的塔身，顶上一盏巨大的、用玻璃棱镜聚光的灯。守塔人是个退伍的老水手，他爬上塔顶，第一次点亮那盏灯时，海面上远远传来船员的欢呼声。老水手站在灯下，咧着嘴笑：“从前我们在海上，最怕的就是夜里看不见岸。现在好了，只要看到这盏灯，就知道家到了。”你仰头看着那束划破夜色的光，忽然觉得，这世上有些光，是专门为迷路的人点的。',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:'r19f',
    battle:false, mandatory:false },
  { id:'r20', period:'roselle', places:[], name:'大帝的远航', short:'大帝远航',
    text:'大帝宣布将亲自率舰队远航，探索那片传说中位于西边的新大陆。消息传开，全国沸腾：码头挤满送行的人，水手们唱着歌往船上搬物资，孩子骑在父亲脖子上挥舞着帝国的小旗。你挤在人群最前面，看见那艘巨大的旗舰缓缓驶出港口，船首像是一头张开巨口的鲸。大帝站在船头，穿着金色的礼服，朝着岸上挥手。没有人知道，这一走，他再也没能活着回来——但那天，所有目送他的人，都以为自己在见证一个新时代的开端。',
    reward:'幸运+1、理智-5', attr:{luck:1}, follow:null,
    battle:false, mandatory:true },
  /* ---- 愚者教会初期扩充（f11-f20） ---- */
  { id:'f11', period:'fool', places:[], name:'第一条朝圣路', short:'朝圣路',
    text:'愚者教会在海边选定了一处圣地，消息传开后，信徒们自发踏出了第一条朝圣路。路上挤满了形形色色的人：有拄着拐杖的老人，有背着孩子的妇人，也有衣着体面的绅士。你跟着走了一程，听见一个满脸风霜的中年人对同伴说：“我从前不信神，觉得神都躲在天上看人受苦。可那位不一样——祂像是真的从人间走过一遭。”同伴问：“你怎么知道？”中年人指指自己的心口：“因为祂记得人间的苦。”你听着他们的对话，望着前方漫漫长路，忽然觉得，信仰这东西，有时候就是一个人愿意为了一句承诺，走上千里路。',
    reward:'信仰+2', attr:{faith:2}, follow:'f11f',
    battle:false, mandatory:false },
  { id:'f12', period:'fool', places:[], name:'旧教会的侧目', short:'旧教会侧目',
    text:'愚者教会发展得越来越快，老牌教会开始坐不住了。蒸汽教会的教士在布道时阴阳怪气：“神只有一位，真理只有一条——有人却想再立一座神坛。”黑夜教会的祭司则保持沉默，只在私下场合提起：“那个新教会的教义……不像邪教，但也不像我们熟悉的任何东西。”你在街角听见这些议论，也看见愚者教会的信徒们不为所动——他们照常做礼拜、照常读圣典、照常资助穷人。你忽然明白，一座教会能不能站稳脚跟，从来不看别人怎么说，只看它能为信众带来什么。',
    reward:'信仰+1、智慧+1', attr:{faith:1, wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f13', period:'fool', places:[], name:'海上的明灯', short:'海上明灯',
    text:'愚者教会在几处凶险海域建起了灯塔，守塔人大多是退伍的水手。传说最南边那座灯塔，建在一片船只经常失事的水域——自灯塔亮起后，那片海域再没沉过一艘船。你认识一位守塔的老水手，他告诉你：“从前我们出海，遇险了只能求老天爷开眼。现在不一样了——只要看见那束光，就知道有人还在看着你。”他说这话时，眼睛亮得吓人。“新神也好，旧神也罢，能给人指路的，就是好神。”你望着远处的灯塔，觉得那束光，确实比什么都让人安心。',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:'f13f',
    battle:false, mandatory:false },
  { id:'f14', period:'fool', places:[], name:'圣典里的谜', short:'圣典之谜',
    text:'《愚者圣典》再版时，细心的读者发现某一页的角落里印着一行模糊的符号——印刷工说那不是他们印的，学者们查遍底稿也找不到出处。消息传开，有人说是神启，有人说是印刷事故，还有人说，那是上一版圣典的印刷工人偷偷塞进去的私货。你翻开自己那本圣典，盯着那行符号看了很久。它长得像字，又不像字；像画，又不像画。你忽然想起黑市上流传的罗塞尔日记——那些符号，和这行字，似乎有几分相似。你合上圣典，决定把这件事藏在心里。',
    reward:'神秘+1、智慧+1', attr:{mystery:1, wisdom:1}, follow:'f14f',
    battle:false, mandatory:false },
  { id:'f15', period:'fool', places:[], name:'教会学堂', short:'教会学堂',
    text:'愚者教会在贫民区开办了学堂，不收学费，还管一顿午饭。学堂里教的不是经书，而是算术、文字和地理——偶尔，先生也会讲一些“外面的世界”的故事。你趴在窗台上听了一下午：先生讲大海那边的城市，讲蒸汽列车，讲天上星星的轨迹。一个孩子举手问：“先生，学这些有什么用？”先生笑了：“学了这些，你们就能自己看懂世界，不用听别人说‘这就是命’。”你忽然觉得心里有什么东西被点亮了。下课后，你偷偷找到先生：“我、我还能来听吗？”先生看着你，温和地说：“学堂的门，永远为你开着。”',
    reward:'智慧+1、信仰+1', attr:{wisdom:1, faith:1}, follow:'f15f',
    battle:false, mandatory:false },
  { id:'f16', period:'fool', places:[], name:'战后的第一季麦子', short:'战后麦田',
    text:'战争结束后的第一年，荒废的田地被重新犁开。你跟着父亲下地，看见泥土里还翻出过弹片和断刀——可种子照样发芽，麦苗照样挺直了腰。村里的老人蹲在田埂上，捻起一把土，放在鼻子底下闻了闻，忽然咧嘴笑了：“土还是活的。只要土活着，人就活得下去。”收割那天，全村人都来帮忙，金黄的麦子堆成小山。你捧着一把新麦，闻着那股干燥的、晒过太阳的味道，忽然觉得，战争或许夺走了很多，但夺不走一样东西——人愿意把日子过下去的念头。',
    reward:'体质+1、金钱+1', attr:{constitution:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f17', period:'fool', places:[], name:'古董拍卖会', short:'古董拍卖',
    text:'城里举办了一场古董拍卖会，据说拍品中混着几件“不太寻常”的旧物。你混进会场，看见台上摆着一只青铜罗盘、一册羊皮手稿、一把刻满符文的匕首。拍卖师敲着木槌：“青铜罗盘，据说能指引迷路之人——起拍价，十金币！”人群里一片倒抽气声。你注意到第一排坐着一个戴面纱的女士，她几乎拍下了所有“不太寻常”的物件，出手阔绰得不像普通人。散场时，你听见她身边的侍女低声问：“小姐，那匕首上的字，您真的认识？”面纱女士沉默片刻，说：“认识。所以它必须在我手里。”',
    reward:'神秘+1、金钱+1', attr:{mystery:1, wealth:1}, follow:'f17f',
    battle:false, mandatory:false },
  { id:'f18', period:'fool', places:[], name:'日记的新解法', short:'日记新解',
    text:'一位年轻学者宣称自己破解了罗塞尔日记的部分符号——他写出的“译文”是一段关于“星辰”“坐标”和“另一片天空”的呓语。学界哗然，有人奉他为天才，有人骂他是骗子。你挤进学者演讲的会场，看见他站在台上，激动得满脸通红：“罗塞尔大帝留下的不是日记，是一份航海图！他在告诉我们——天上有路！”台下嘘声一片。散场后，你看见那学者独自坐在台阶上，对着自己翻译的纸页发呆。你走过去，他抬头看你，疲惫地笑了笑：“他们都觉得我疯了。可我知道，那些符号里，藏着比大海更远的东西。”',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null,
    battle:false, mandatory:false },
  { id:'f19', period:'fool', places:[], name:'塔罗聚会', short:'塔罗聚会',
    text:'城里兴起了一种半公开的“塔罗聚会”：入场的客人戴面具，凭一枚刻着塔罗图案的铜币入场，聚会上有人讲经、有人解牌、有人交换奇闻。你花两枚铜币弄到一枚“月亮”币，混了进去。聚会的主人是个嗓音低沉的女士，她讲了半宿“塔罗牌的起源”，最后神秘地说：“真正的塔罗，不是纸牌——是一套观测命运的仪轨。有些人把它当玩具，有些人把它当钥匙。”散场时，她走到你面前，看着你胸前的“月亮”币，轻声说：“月亮代表阴影与潜意识。孩子，你有不少秘密，自己都还没发现。”',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:'f19f',
    battle:false, mandatory:false },
  { id:'f20', period:'fool', places:[], name:'教会的守夜人', short:'守夜人',
    text:'愚者教会组织了一支守夜巡逻队，专在深夜里巡视城郊——不抓贼，不查人，只处理“夜里不该出现的东西”。你曾远远见过他们：一队穿黑袍的人，举着灯笼，无声地走过街道，灯笼的光是淡蓝色的。有好奇的醉汉跟过他们，第二天逢人就说：“他们走到老墓园门口，站了半个钟头，然后鞠躬，走了——对着空气鞠躬！”守夜人从不解释。只在一次巡逻后，领队的老者对围观的居民说了一句话：“各位安心睡吧。夜里的事，交给我们。白天的事，才归你们。”你躺在床上，听着巡逻队的脚步声远去，忽然觉得很安心。',
    reward:'信仰+1、勇气+1', attr:{faith:1, courage:1}, follow:'f20f',
    battle:false, mandatory:false },
  /* ---- 克莱恩穿越前扩充（b51-b60） ---- */
  { id:'b51', period:'before', places:[], name:'丰收节舞会', short:'丰收舞会',
    text:'丰收节到了，镇中心的广场上搭起木台，挂满金黄的麦穗和彩带。傍晚时分，乐手们拉起手风琴，男女老少都涌进广场跳舞。你个子矮，被挤在人群边上，只能看见大人的腿和转动的裙摆。一个红发姑娘忽然从人群里钻出来，拉住你的手：“别站着呀，一起跳！”你被她拽进人群，笨手笨脚地跟着转圈，惹得周围人哈哈大笑。跳累了，她塞给你一块烤饼：“吃吧，丰收节就是要人人有吃的。”你咬了一口，烫得直哈气，却觉得，那是我这辈子吃过最香的一块饼。',
    reward:'幸运+1、体质+1', attr:{luck:1, constitution:1}, follow:'b51f',
    battle:false, mandatory:false },
  { id:'b52', period:'before', places:[], name:'第一班蒸汽邮车', short:'蒸汽邮车',
    text:'小镇迎来了第一班蒸汽邮车：黑铁的车厢，突突冒着白汽，从远方的城市开来，带来报纸、信件和外面世界的消息。邮差把一摞报纸搁在杂货店门口，人们围上去抢着看。你挤进人群，看见报纸头版印着大字：“王国与邻国签署贸易协定”“贵族舞会丑闻”“蒸汽列车延伸至西部诸郡”。你逐字读完，忽然觉得，原来世界这么大——而你所在的小镇，只是地图上一个针尖大的点。邮差拍拍你的肩：“小子，好好认字。认了字，世界就是你的。”',
    reward:'智慧+1', attr:{wisdom:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b53', period:'before', places:[], name:'港口的信号旗', short:'信号旗',
    text:'海港的瞭望塔上挂满了各色旗帜，红黄蓝绿，迎风招展——那是港口的语言。你缠着守塔的老旗手学会了认旗：红色代表风暴预警，黄色代表检疫，蓝白相间代表商船进港。老旗手一边给你讲，一边叹气：“现在用旗子的人越来越少了。等电报线铺到这儿，这些旗子，怕是要退休喽。”他摸着你头顶说：“孩子，记住这些旗子——它们救过的命，比你想的多。”那天傍晚，瞭望塔挂起了一面黑旗：有船沉了。整个港口的人沉默地望着海面，只有旗子在风里哗哗作响。',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:'b53f',
    battle:false, mandatory:false },
  { id:'b54', period:'before', places:[], name:'老钟表匠', short:'钟表匠',
    text:'镇上的老钟表匠是个怪人：他不怎么出门，店里堆满各式各样的钟表，滴答声从早响到晚。你常趴在店门口看他修表——他用镊子夹起细小的齿轮，凑到眼前，屏住呼吸，一放就是半个时辰。有一天他招手让你进店，递给你一只坏了的老怀表：“帮我拿一会儿，别让它掉地上。”你捧着怀表，他低头忙活。过了很久，他忽然说：“孩子，你知道钟表为什么能走吗？因为每一颗齿轮，都认准了自己的位置。人也是一样——找对了位置，就一辈子不会乱。”他把修好的怀表装进你口袋：“送你了。等你想清楚自己要做什么，再看它。”',
    reward:'智慧+1、幸运+1', attr:{wisdom:1, luck:1}, follow:'b54f',
    battle:false, mandatory:false },
  { id:'b55', period:'before', places:[], name:'贵族围猎日', short:'围猎日',
    text:'贵族老爷们每年秋天都来镇外的林地围猎，浩浩荡荡的马队扬起漫天尘土。你跟着村里的孩子们趴在树丛里偷看：老爷们穿着猩红的猎装，猎犬吠叫着冲进林子，惊起成群的鸟。一个年轻的贵族少年骑马跑过，忽然勒住缰绳，朝你们藏身的方向喊：“嘿！树丛里的小子们，出来！帮我追那只鹿！”孩子们一哄而散，只有你被树枝挂住了衣角，被他逮个正着。他跳下马，没生气，反而咧嘴笑了：“胆子不小。喏，赏你的。”他扔给你一枚银币，又翻身上马追鹿去了。你攥着那枚银币，觉得贵族也没传说中那么可怕。',

    battle:false, mandatory:false },
  { id:'b56', period:'before', places:[], name:'远来的商队', short:'商队',
    text:'一支远道而来的商队停在了镇外：驼队、马车、花花绿绿的货物，还有一群肤色各异、说着生硬通用语的商人。他们带来丝绸、香料、彩色玻璃珠，还有你从没见过的新鲜水果。商队头领是个络腮胡大汉，他坐在火堆边，给围观的孩子们讲远方的故事：“翻过七座山，渡过七条河，有一座城，城里的房子是用贝壳建的，屋顶在月光下会发光。”孩子们听得眼睛发直。临走时，头领塞给你一把干果：“吃吧，这是山那边的味道。”你攥着那把干果，忽然觉得，世界比老师讲的课本，要大得多。',
    reward:'智慧+1、金钱+1', attr:{wisdom:1, wealth:1}, follow:null,
    battle:false, mandatory:false },
  { id:'b57', period:'before', places:[], name:'发光的废矿', short:'废矿发光',
    text:'镇外的废矿洞最近闹了怪事：夜里，矿洞深处会透出幽绿色的光，明明灭灭，像谁在洞里点了灯。胆大的年轻人结伴去探过，回来却说洞里什么都没有，只是空气里有一股说不出的甜味。老人们不许孩子们靠近：“矿洞里的东西，挖不得，也看不得。”你不信邪，有天傍晚偷偷溜到洞口——果然看见幽绿的光，从洞深处一阵一阵地涌出来，像呼吸一样。你正要走，忽然听见洞里传来一声极轻的叹息。你头也不回地跑了。那天晚上，你做了整夜的梦，梦见矿洞深处，有什么东西在对你招手。',
    reward:'神秘+1、理智-5', attr:{mystery:1}, follow:'b57f',
    battle:false, mandatory:false },
  { id:'b58', period:'before', places:[], name:'剧场的火', short:'剧场火情',
    text:'巡回剧团在镇上搭台演出，演到高潮时，后台忽然蹿出火苗。人群顿时炸了锅，哭喊声、桌椅翻倒声响成一片。你被挤在人群里，眼看一个孩子被撞倒在地，马上要被踩到——你也不知道哪来的力气，扑过去把他拽起来，一路护着他挤到门口。剧团的火被扑灭后，孩子的母亲抱着孩子哭成一团，拉着你的手不住道谢。你这才发现，自己的衣袖烧焦了一大块，胳膊上燎起一串水泡。可你心里，却有一种说不上来的踏实。',

  { id:'b59', period:'before', places:[], name:'初雪与粥棚', short:'初雪施粥',
    text:'入冬的第一场雪落下来的那天，镇上的富人搭起了施粥棚。你端着自家的碗去排队，看见粥棚前的人排成两行长龙——有裹着破棉袄的乞丐，有抱着孩子的妇人，也有穿着体面却面色灰败的男人。施粥的是富人家的小姐，她戴着白手套，一勺一勺地舀粥，动作有些生疏，却始终没有皱过眉。轮到你时，她多舀了一勺：“天冷，喝稠点的。”你捧着热粥，站在雪地里喝了一口，暖意从喉咙一路淌到心里。你抬头看看漫天飞雪，觉得这个冬天，似乎也没那么难捱了。',

  { id:'b60', period:'before', places:[], name:'路过的占星人', short:'占星人',
    text:'一个穿旧袍子的占星人路过小镇，在广场上支起一顶帐篷，挂出招牌：“观星问命，童叟无欺，不准不要钱。”镇上的大人大多嗤之以鼻，孩子们却好奇地围上去。占星人看了一圈孩子，忽然指住你：“这孩子，眼睛里有星屑。”他拉你进帐篷，对着你看了半天，又看了看他画的星图，眉头越皱越紧：“奇怪……你的命星，不在我这张图上。”他沉默了一会儿，把一块磨得发亮的星形石头塞进你手里：“拿着。等你哪天看见真正的星空，就知道它有什么用。”你攥着那块石头，将信将疑。可那块石头，你一直没舍得扔。',

  { id:'b51f', period:'before', places:[], name:'舞会之后', short:'舞会之后',

    text:'老钟表匠收你做了学徒。头一个月，你光练一件事——用镊子夹起比米粒还小的齿轮，摆回原位，手不能抖。你夹坏了十七个齿轮，老钟表匠也没骂你，只是把坏齿轮收进一只铁盒：“坏了不怕，怕的是不敢修。”半年后，你修好了第一只真正坏掉的怀表。老钟表匠拿起听诊器听了听，露出一个罕见的笑：“走得准了。”他把那只铁盒推到你面前：“这些坏齿轮，都是你摔的跟头。留着，将来教徒弟用。”你低头看着铁盒，忽然明白，这世上没有白摔的跟头。',

    text:'你本以为那枚银币的事就到此为止了——可半个月后，一封信送到了你家。信上印着贵族纹章，措辞却意外地客气：“听闻少年身手敏捷、胆识过人，下月围猎，愿汝同行，代为执旗。”你父亲把信翻来覆去看了三遍，嘴唇直哆嗦：“贵族老爷给咱家送信了……”围猎那天，你举着猎场的旗子跑了一整天，跑得两腿发软。可那个年轻的贵族少年——他叫阿尔杰·威尔逊——在营地边上找到你，扔给你一壶水：“跑得不错。比我这群马弁强。”后来，你们成了常有书信往来的朋友。',

  { id:'b57f', period:'before', places:[], name:'矿洞深处', short:'矿洞深处',
    text:'你终究还是没忍住，跟着两个胆大的年轻人进了那座发光的废矿。矿道越深，那幽绿的光就越亮，空气里那股甜味也越来越浓。走到最深处，你们看见——石壁上盘着一条会发光的藤蔓，藤蔓尽头，结着一颗拳头大的、半透明的果实，像一颗凝固的月亮。一个同伴伸手去摘，你忽然听见一声极轻的叹息，像上次在洞口听到的一样。你一把拽住他：“别碰！”话音刚落，藤蔓忽然剧烈抖动，整条矿道都在震颤。你们夺路狂奔，冲出洞口时，背后传来一声沉闷的坍塌。那颗果实，永远埋在了矿洞深处。',

  { id:'b58f', period:'before', places:[], name:'剧团的答谢', short:'剧团答谢',
    text:'巡回剧团临走前，专门来你家道谢——团长是个蓄着络腮胡的高大男人，他握着你的手说：“那天要不是你，那孩子怕是凶多吉少。”他塞给你一张戏票和一枚银币：“明年我们还来，到时候，你坐最好的位置。”你送他们出镇，团长忽然压低声音：“小子，我看你眼神正，告诉你个秘密——我们剧团，不光是演戏的。有些戏班子，白天唱戏，夜里替人送信。要是哪天你需要……递消息给远方的什么人，可以来找我。”他拍拍你的肩，没再多说，转身追上了队伍。',

  /* klein 后续 */
  { id:'k12f', period:'klein', places:['廷根市'], name:'黑荆棘的夜班', short:'黑荆棘夜班',
    text:'几个月后，你听说“黑荆棘安保公司”又贴出了招聘启事——这次是招“夜间档案整理员”。你鼓起勇气去应聘，接待你的是一位面容温和、目光却格外锐利的年轻女士。她问了你几个奇怪的问题：“你怕黑吗？”“你见过……不该存在的东西吗？”你老老实实回答。她沉默片刻，说：“回去等消息吧。”你等了半个月，没有等到回音。可你后来听说，那家公司的夜班里，多了一个姓克莱恩的登记员——他上任不到一个月，公司里就发生了不少事。你庆幸自己没被录用，可又忍不住好奇：那家公司的夜里，究竟藏着什么。',
    reward:'神秘+1、幸运+1', attr:{mystery:1, luck:1}, follow:null, battle:false, mandatory:false },
  { id:'k13f', period:'klein', places:['贝克兰德'], name:'乌鸦胸针', short:'乌鸦胸针',
    text:'那枚乌鸦胸针在你口袋里躺了半个月。这天傍晚，一个穿灰色大衣的男人忽然在你回家路上拦住了你：“小友，你捡到的东西——可以还给我吗？”你警惕地后退：“什么东西？”他笑了一下，从怀里取出一模一样的另一枚胸针：“这种胸针，一共三枚。一枚在我这里，一枚在你那里，还有一枚……在一位先生手里，他托我找回剩下的。”他把一枚金币放在你手心：“买你的好奇心。”你攥着金币，把胸针给了他。他临走时回头：“记住，别打听这胸针的事。有些东西，知道得越少，睡得越安稳。”',
    reward:'金钱+2、理智-5', attr:{wealth:2}, follow:null, battle:false, mandatory:false },
  { id:'k15f', period:'klein', places:[], name:'出征前夜', short:'出征前夜',
    text:'邻家的男人最终还是去了前线。出征前夜，他的妻子抱着襁褓里的孩子来你家借热水，眼眶红红的，却笑着说：“他说了，打完仗就回来，带我去首都看看。”你帮她把孩子哄睡，听见她坐在灶台边低声哼一支调子很慢的歌。三个月后，邮差送来一封信——信是从前线寄来的，信封上沾着泥。女人拆信的手抖得厉害，读完后，她靠着门框笑了很久，又哭了很久。信里只有一句话：“仗快打完了。等我回来，带你去首都看钟楼。”你站在院门口，看着春天正在漫过田野，忽然觉得，有些等待，比战争更漫长，也比战争更坚强。',
    reward:'信仰+1、理智+5', attr:{faith:1}, follow:null, battle:false, mandatory:false },
  { id:'k16f', period:'klein', places:[], name:'车厢里的注视', short:'车厢注视',
    text:'蒸汽列车通车后的第三个月，你终于攒够钱买了一张站票，坐上那列钢铁巨兽。你挤在车厢连接处，看着窗外的田野、河流、城镇飞快地向后退去。经过一座大桥时，列车忽然减速，你鬼使神差地往第三节车厢的方向看了一眼——那个看不清面孔的人又站在窗边，隔着玻璃注视着你。这一次，他抬起手，朝你轻轻挥了挥。你想喊，列车却已经加速，那人消失在车窗后。到站后，你特地去第三节车厢看了一眼：空空如也，座椅上放着一枚银币，背面刻着一只眼睛。你把它揣进口袋，从此再没坐过那列车的第三节。',
    reward:'神秘+2、金钱+1', attr:{mystery:2, wealth:1}, follow:null, battle:false, mandatory:false },
  { id:'k17f', period:'klein', places:['廷根市'], name:'单片眼镜的老人', short:'单片眼镜',
    text:'你又去了那家“占卜家俱乐部”，这次是白天——前院里，那个戴单片眼镜的老先生正坐在藤椅上晒太阳，面前摆着一盘残棋。他看见你，招招手：“来，陪我下一盘。”你哪会下棋，胡乱落子，他却不恼，一边下一边说：“上次跟你说，你命里有一道坎，坎上站着一只乌鸦。后来我想了想，说岔了。”你一愣。他把一枚白子轻轻按在棋盘上：“不是一只乌鸦，是一群。你这个人呀，注定要在是非堆里打滚。”他忽然抬头，单片眼镜映着天光：“不过，滚得越深，爬得越高。年轻人，胆子大点，没坏处。”',
    reward:'智慧+1、幸运+1', attr:{wisdom:1, luck:1}, follow:null, battle:false, mandatory:false },
  { id:'k18f', period:'klein', places:[], name:'残页的主人', short:'残页主人',
    text:'你再见到那个卖日记残页的老人，是在城郊的旧货市场。他这次没叫卖，只是坐在角落里，面前摊着那页泛黄的纸，像是在等人。你走过去，他看见你，咧嘴一笑：“我就知道你会来。这页纸，你上次看了两眼，我就知道你看得懂。”你摇头：“我认不得那些符号。”老人把纸页往前推了推：“认不认得不要紧。我要走了，这页纸送给你——留着，将来你遇到认得它的人，告诉他：罗塞尔的东西，别急着全解开，会咬人。”说完，他站起身，拄着拐棍慢慢消失在人群里。你低头看那页纸，上面的符号，仿佛在微微发亮。',
    reward:'神秘+1、智慧+1、理智-5', attr:{mystery:1, wisdom:1}, follow:null, battle:false, mandatory:false },
  { id:'k20f', period:'klein', places:[], name:'值夜者的来客', short:'值夜者来客',
    text:'那晚的黑色马车，在你心里扎了根。你悄悄打听，得知那些穿制服的人来自一个叫“值夜者”的组织。你按捺不住好奇，有天傍晚，远远跟着一个值夜者走到城郊的老墓园。他停在墓园门口，忽然回头：“跟了三条街，累不累？”你僵在原地。他走近，上下打量你，语气意外的平和：“孩子，好奇心是好事，但好奇心要用对地方。那户人家的事，已经解决了——你以后夜里听到奇怪的声音，别出门，关好窗，点一盏灯。”他顿了顿：“如果你将来想真正看懂这个世界……成年以后，可以来值夜者办事处问问。”说完，他转身走进暮色里。你站在墓园门口，心跳得飞快。',
    reward:'神秘+1、勇气+1', attr:{mystery:1, courage:1}, follow:null, battle:false, mandatory:false },
  /* roselle 后续 */
  { id:'r11f', period:'roselle', places:[], name:'机器的代价', short:'机器的代价',
    text:'蒸汽吊机投入使用三个月后，码头发生了第一次事故：吊臂的钢索崩断，一箱铸铁砸在栈桥上，压伤了一个老水手的脚。码头上人心惶惶，有人喊着“拆了这铁疙瘩”。可第二天，工人们又在吊机旁忙活起来——工程师连夜换了更粗的钢索，给吊机加装了防护网。你在人群里看见上次那个宣讲的男人，他站在吊机下，声音沙哑：“机器不是魔鬼，是工具。魔鬼不会救人，工具会——只要用对了人。”三个月后，老水手的脚伤好了，又回到码头干活，只是走路有些跛。他站在吊机阴影里，抬头看着那台大家伙，嘟囔了一句：“铁疙瘩……倒也有点良心。”',
    reward:'智慧+1、体质+1', attr:{wisdom:1, constitution:1}, follow:null, battle:false, mandatory:false },
  { id:'r12f', period:'roselle', places:[], name:'远洋的消息', short:'远洋消息',
    text:'生日宴后不到半年，大帝果然宣布了一件大事：帝国将组建远洋舰队，向西探索“另一片大陆”。消息传开，整个王国沸腾。你从仆人们口中拼凑出细节：舰队将由大帝亲自点名的将领统帅，招募最优秀的船长和水手，还会带上学者、工匠和一批“试验用的机器”。码头上的年轻人挤破头想报名。你看见一个瘦削的青年水手攥着报名表，手都在抖：“我要去！大帝要去的海，一定是好海！”你望着远处海平线，忽然觉得，一个时代真的开始了——而所有生在这个时代的人，都将成为这段历史的一部分。',
    reward:'智慧+1、幸运+1', attr:{wisdom:1, luck:1}, follow:null, battle:false, mandatory:false },
  { id:'r13f', period:'roselle', places:[], name:'船长归来', short:'船长归来',
    text:'那位装炮出海的年轻船长，三个月后回来了。船身弹痕累累，帆破了两面，可船舱里装满了货物，甲板上还站着十几个新面孔的水手。码头上的人群欢呼着迎接他。船长跳上岸，晒得黝黑的脸笑得灿烂：“海盗是打跑了——不过诸位，从今天起，我这船要跑远洋线，直通大帝的新殖民地！”他看见你站在人群里，居然还记得你：“小子！你也来！将来我这船上，缺一个识字的管事！”你还没反应过来，他已经大笑着被人群簇拥走了。那天晚上你躺在床上，翻来覆去睡不着，满脑子都是那句“识字的管事”。',
    reward:'勇气+1、金钱+1、神秘+1', attr:{courage:1, wealth:1, mystery:1}, follow:null, battle:false, mandatory:false },
  { id:'r14f', period:'roselle', places:[], name:'纸上的符号', short:'纸上符号',
    text:'送纸的商人偷偷塞给你一张边角料——是那种特制的厚纸，上面残留着几个大帝写过的符号。你对着那符号看了整整一夜，越看越觉得它像某种有规律的东西：不是天书，像……像另一种文字。第二天，你把它拿给镇上一个走南闯北的老行商看。老行商眯着眼瞧了半天，忽然一拍大腿：“这不是字！是图！你看——这弯钩是码头，这圆圈是太阳，这箭头，是指向海的方向！”他压低声音：“我年轻时跟着船队跑过一趟南大陆，见过当地的祭司在石头上刻这样的东西。大帝画的……像是某种地图！”你盯着那符号，忽然觉得，罗塞尔大帝的秘密，可能比整片大海还要深。',
    reward:'智慧+2、神秘+1', attr:{wisdom:2, mystery:1}, follow:null, battle:false, mandatory:false },
  { id:'r15f', period:'roselle', places:[], name:'殖民地的信', short:'殖民地的信',
    text:'那对年轻夫妇走后的第二年春天，镇上收到了他们托商船捎回来的信。信是丈夫写的，字迹歪歪扭扭：“此地土地肥沃，种什么活什么。屋后开了三亩地，种了玉米和马铃薯。孩子会走路了，晒得黑黑的，成天追着鸡跑。就是夜里冷，海边风大。别担心我们——这里是苦，但是有奔头。明年，我想把爹娘也接过来。”信在镇上传了一圈，有人羡慕，有人摇头。你看着信纸上那些歪歪扭扭的字，忽然觉得，那就是勇气最朴素的样子——明知道苦，还是愿意把日子往甜处过。',
    reward:'信仰+1、勇气+1', attr:{faith:1, courage:1}, follow:null, battle:false, mandatory:false },
  { id:'r17f', period:'roselle', places:[], name:'舰队长的邀请', short:'舰队长邀请',
    text:'那个棕发骑士——如今已经是帝国最年轻的舰队长——率领舰队停靠在你家乡的港口补给。你挤在人群里看舰队入港，没想到他竟在人群里认出了你：“喂，那个围观比武的小子！”他跳下船，拍拍你的肩：“我记性好得很。你当时看我的眼神，跟别人不一样——别人看热闹，你看门道。”他压低声音：“我缺一个机灵的后勤官，帮我管账目、认文书。你要是识字，来我船上试试。”你张了张嘴，还没回答，他已经大步走远了：“想好了就来码头找我！船三天后出发！”你站在原地，心跳如鼓。',
    reward:'金钱+2、勇气+1、结识人脉', attr:{wealth:2, courage:1}, follow:null, battle:false, mandatory:false },
  { id:'r19f', period:'roselle', places:[], name:'守塔人的话', short:'守塔人',
    text:'灯塔落成半年后，你常去看望那个守塔的老水手。他总是一边擦灯，一边给你讲海上的故事：“有一回，我们在风暴里迷了路，三天三夜看不见星星。船长都要放弃了——忽然，桅杆瞭望的人喊：‘灯！有灯！’你猜怎么着？那盏灯，就是我们家乡这座灯塔。隔着一百海里，它愣是让我们看见了。”他忽然沉默了一会儿：“孩子，灯塔这东西，从来不是为白天造的。人一辈子，总有几个黑夜要过。过了黑夜，还能看见光的人，才算真正活过。”你似懂非懂，却把那句话记了一辈子。',
    reward:'信仰+1、幸运+1', attr:{faith:1, luck:1}, follow:null, battle:false, mandatory:false },
  /* fool 后续 */
  { id:'f11f', period:'fool', places:[], name:'圣地所见', short:'圣地所见',
    text:'你终于走完了那条朝圣路，抵达海边圣地。圣地其实很朴素：一片平整的礁石，一座白石砌的小教堂，教堂前立着一块碑，碑上刻着建会时的一句话：“真理在人间。”你在那里住了一晚，看见来自各地的信徒聚在礁石上祈祷、交谈、分享干粮。一个老信徒对你说：“很多人以为，朝圣是为了求神赐福。其实走完这条路你就会明白——神早就给了你两条腿。朝圣，是让人想清楚，这两条腿，该往哪儿走。”你望着海上初升的太阳，忽然觉得，这一路走得值。',
    reward:'信仰+2、理智+5', attr:{faith:2}, follow:null, battle:false, mandatory:false },
  { id:'f13f', period:'fool', places:[], name:'灯塔下的孩子', short:'灯塔孩子',
    text:'你跟着守塔的老水手在灯塔里住了一晚。半夜，他被一阵急促的敲门声惊醒——门外站着一个浑身湿透的年轻水手：“船、船搁浅了！就在南边礁石群！还有十几个人困在船上！”老水手二话不说，披上外衣，拉响塔顶的警报铃，又点亮了灯塔的备用灯。你们赶到海边时，附近几条渔船已经自发赶来救人。天蒙蒙亮时，十几个人全部获救。获救的船长跪在礁石上，抱着老水手的腿痛哭：“是您的灯救了我们！”老水手把他扶起来，拍拍他的肩：“别谢我。回去告诉你们船东——灯塔的维护费，该涨了。”你站在晨光里，看着这一幕，忽然明白了什么叫“给人指路”。',
    reward:'信仰+1、体质+1、幸运+1', attr:{faith:1, constitution:1, luck:1}, follow:null, battle:false, mandatory:false },
  { id:'f14f', period:'fool', places:[], name:'符号的回响', short:'符号回响',
    text:'关于圣典里那行神秘符号，你一直没有对任何人说起。可某个深夜，你忽然惊醒——梦里，那行符号在你眼前一个接一个地亮起来，像被点燃的引线。你翻身下床，点起油灯，把那本《愚者圣典》翻到那一页。借着灯光，你发现那行符号下面，多了一行极淡的字，白天绝对看不见：“看见此页者，请在黎明前，把这本书带到海边。”你攥着圣典，犹豫了很久。天亮前，你终于走到海边。潮水退去后的沙滩上，赫然有一行脚印——从海里走出来，又走回海里。你把圣典放在脚印尽头。海浪涌上来，卷走了它。你站在原地，不知道自己是做了一场梦，还是真的参与了什么。',
    reward:'神秘+2、理智-10', attr:{mystery:2}, follow:null, battle:false, mandatory:false },
  { id:'f15f', period:'fool', places:[], name:'学堂的先生', short:'学堂先生',
    text:'你成了教会学堂最常来的旁听生。先生姓何，是个瘦高的中年人，据说年轻时走过很多地方。他教孩子们算术，也教他们写自己的名字——他常说：“人这一辈子，要先把名字写端正，再把日子过端正。”有一次课后，他单独留下你：“你的眼睛，比他们多一层东西。”你愣住。他指指自己的眼睛，又指指窗外：“有些人看世界，只看得到白天；你能看到白天和黑夜之间那层东西——这既是天赋，也是负担。”他顿了顿：“教会正在筹办一所‘夜间学校’，教一些……更深的东西。你长大了，如果还想学，来找我。”',
    reward:'智慧+1、神秘+1', attr:{wisdom:1, mystery:1}, follow:null, battle:false, mandatory:false },
  { id:'f17f', period:'fool', places:[], name:'面纱女士的邀约', short:'面纱女士',
    text:'拍卖会上的面纱女士，居然派人给你送来一封信和一枚银币。信上写着一手漂亮的字：“小友，那天拍卖会上，你注意到那把匕首时的眼神，让我想起自己年轻时。城南的旧宅，若你有兴趣，可以来看看——我那儿收着几件‘不太寻常’的东西，需要一个年轻人帮忙整理目录。报酬从优。”你捏着信，犹豫了两天，最终还是去了。旧宅的书房里堆满了瓶瓶罐罐、旧书残卷。面纱女士坐在窗边，看着你搬完一箱书，忽然开口：“知道我为什么挑中你吗？因为你看那把匕首的眼神里，有敬畏——碰过太多不该碰的东西的人，才会懂敬畏。”',
    reward:'金钱+2、神秘+1、结识人脉', attr:{wealth:2, mystery:1}, follow:null, battle:false, mandatory:false },
  { id:'f19f', period:'fool', places:[], name:'月亮币的回访', short:'月亮币回访',
    text:'你在下一场塔罗聚会上又遇见了那位戴面具的女士。这次她主动走到你面前：“你来了。看来我上次说的没错——你对自己，果然还有很多没发现。”她带你坐到角落，取出一副洗得发亮的旧塔罗牌：“来，抽一张。”你抽出一张：月亮。她沉默了很久，声音低下来：“月亮这张牌，是阴影，是潜意识，也是……被遮蔽的真相。孩子，你身边有一件事，你看得见，却一直在装作看不见。”你心口一跳：“什么事？”她摇摇头，收起牌：“不到时候。等你真正准备好的那天，你会自己来问我。”她说完，便起身汇入了人群，像一滴水消失在大海里。',

/* ===== 工具 ===== */
const $ = (id) => document.getElementById(id);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

/* ===== 转盘 SVG 构建 ===== */
function polar(cx, cy, r, a){
  const rad = (a - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function sectorPath(cx, cy, r, start, end){
  const [x0, y0] = polar(cx, cy, r, start);
  const [x1, y1] = polar(cx, cy, r, end);
  const large = (end - start) > 180 ? 1 : 0;
  return 'M ' + cx + ' ' + cy + ' L ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
         ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
}
/* 转盘配色：深蓝紫系深浅渐变（浅→深循环） */
const WHEEL_PALETTE = ['#24345c','#2c3e68','#334873','#3b507e','#3f4a76','#454178','#4a3a74','#50346e','#40466f','#4a4070','#283a62','#31446e'];
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n >> 16) & 255) + Math.round(255 * amt)));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + Math.round(255 * amt)));
  const b = Math.max(0, Math.min(255, (n & 255) + Math.round(255 * amt)));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function buildWheel(svg, segments){
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 150, cy = 150, r = 137;
  svg.innerHTML = '';
  const defs = document.createElementNS(NS, 'defs');
  const g = document.createElementNS(NS, 'g');
  segments.forEach(function(s, i){
    const color = s.color || WHEEL_PALETTE[i % WHEEL_PALETTE.length];
    const gid = 'wg' + i + '_' + Math.random().toString(36).slice(2, 7);
    const grad = document.createElementNS(NS, 'linearGradient');
    grad.setAttribute('id', gid);
    grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
    grad.setAttribute('x2', '1'); grad.setAttribute('y2', '1');
    const st1 = document.createElementNS(NS, 'stop');
    st1.setAttribute('offset', '0%'); st1.setAttribute('stop-color', shade(color, 0.16));
    const st2 = document.createElementNS(NS, 'stop');
    st2.setAttribute('offset', '100%'); st2.setAttribute('stop-color', shade(color, -0.10));
    grad.appendChild(st1); grad.appendChild(st2);
    defs.appendChild(grad);
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', sectorPath(cx, cy, r, s.start, s.end));
    p.setAttribute('fill', 'url(#' + gid + ')');
    p.setAttribute('stroke', 'rgba(255,255,255,0.14)');
    p.setAttribute('stroke-width', '1');
    g.appendChild(p);
    /* 文字：短名优先；按弧长动态缩字号；过窄则沿半径竖排 */
    const label = s.short || s.label;
    const tipParts = [s.label];
    if (s.data){
      const dd = s.data.desc || s.data.apply || s.data.tag || '';
      if (dd) tipParts.push(dd);
    }
    const tip = tipParts.join(' — ');
    const mid = (s.start + s.end) / 2;
    const rad = (mid - 90) * Math.PI / 180;
    const segSize = s.end - s.start;
    const arcLen = 2 * Math.PI * r * (segSize / 360);
    const len = label.length;
    let fs = segSize <= 22 ? 8.5 : segSize <= 40 ? 10 : 11.5;
    if (arcLen < len * fs * 1.02) fs = Math.max(6.5, arcLen / (len * 1.02));
    const canFit = fs >= 7;
    const posR = segSize <= 20 ? 0.72 * r : segSize <= 40 ? 0.62 * r : 0.56 * r;
    if (len <= 1 || canFit){
      const tx = cx + posR * Math.cos(rad);
      const ty = cy + posR * Math.sin(rad);
      const t1 = document.createElementNS(NS, 'text');
      t1.setAttribute('x', tx); t1.setAttribute('y', ty);
      t1.setAttribute('text-anchor', 'middle');
      t1.setAttribute('fill', '#f4f1ea');
      t1.setAttribute('font-size', fs);
      t1.setAttribute('font-weight', '600');
      t1.setAttribute('font-family', 'var(--serif)');
      t1.textContent = label;
      const tt = document.createElementNS(NS, 'title');
      tt.textContent = tip;
      t1.appendChild(tt);
      g.appendChild(t1);
      if (s.sub){
        const t2 = document.createElementNS(NS, 'text');
        t2.setAttribute('x', tx); t2.setAttribute('y', ty + fs + 4);
        t2.setAttribute('text-anchor', 'middle');

function nextRotation(current, targetAngleFromTop){
  const mod = ((current % 360) + 360) % 360;
  const desired = (360 - targetAngleFromTop) % 360;
  let delta = (desired - mod + 360) % 360;
  const turns = 22 + Math.floor(Math.random() * 11);   /* 22-32 圈 */
  return current + delta + 360 * turns;
}
function spinWheel(wheel, current, targetAngle, durSec){
  spinning = true;
  const next = nextRotation(current, targetAngle);
  wheel.style.transition = SLOW
    ? 'transform ' + (durSec || 10.5) + 's cubic-bezier(0.1,0.85,0.12,1)'
    : 'transform 0.01ms linear';
  wheel.style.transform = 'rotate(' + next + 'deg)';
  return next;
}

let stageSegs = null, stageHandler = null;

function segsFromWeights(items){
  const total = items.reduce(function(a, x){ return a + (x.w != null ? x.w : x.weight); }, 0);
  let acc = 0;
  return items.map(function(x){
    const w = x.w != null ? x.w : x.weight;
    const start = acc;
    const end = acc + w / total * 360;
    acc = end;
    return { label: x.name, color: x.color || '', short: x.short || '', start: start, end: end, data: x };
  });
}
function showWheelResultFor(elId, label, desc){

function setupStage(title, sub, segments, btnText, handler){
  hideWheelResult();
  $('wheel3Title').textContent = title;
  $('wheel3Sub').textContent = sub || '';
  $('wheel3Sub').className = '';
  wheel3.style.transition = 'none';
  wheel3.style.transform = 'rotate(0deg)';
  void wheel3.getBoundingClientRect();
  wheel3.style.transition = '';
  rot3 = 0;
  buildWheel(wheel3, segments);
  const btn = $('spin3');
  btn.disabled = false;
  btn.textContent = btnText || '转动';
  stageSegs = segments;
  stageHandler = handler;
  $('wheel3Wrap').classList.remove('hidden');
  $('wheel3Wrap').classList.add('enter');

function spinStageFlow(){
  if (spinning) return;
  if (stageHandler && stageHandler.noSpin){
    const h = stageHandler;
    stageHandler = null;
    h();
    return;
  }
  if (!stageHandler || !stageSegs) return;
  hideWheelResult();
  const btn = $('spin3');
  btn.disabled = true;
  btn.textContent = '命运转动中……';
  const segs = stageSegs;
  const idx = weightedPick(segs);
  const target = landingAngle(segs[idx].start, segs[idx].end);
  wheel3.classList.add('spinning');
  rot3 = spinWheel(wheel3, rot3, target);
  setTimeout(function(){
    spinning = false;
    wheel3.classList.remove('spinning');
    litSector(wheel3, idx);
    const d = segs[idx].data;
    showWheelResult(segs[idx].label, d.desc || d.apply || d.tag || '');
    const h = stageHandler;
    stageHandler = null;
    h(segs[idx].data);
  }, SLOW ? 10700 : 350);
}
function weightedPick(segments){
  const pool = [];
  segments.forEach(function(s, i){
    const n = Math.max(1, Math.round((s.end - s.start) / 360 * 140));
    for (let k = 0; k < n; k++) pool.push(i);
  });
  return pool[Math.floor(Math.random() * pool.length)];
}

        s.seq = 9;

function attrLabel(key){

function specialHit(){

  if (!s.specialTrig) s.specialTrig = {};
  const trig = s.specialTrig;
  for (let i = 0; i < SPECIAL_ATTRS.length; i++){
    const key = SPECIAL_ATTRS[i];
    const v = s[key] || 0;
    if (v < 10) continue;
    if (!trig[key]) trig[key] = {};
    const arr = [10, 15, 20];
    for (let j = 0; j < arr.length; j++){
      const th = arr[j];
      if (v >= th && !trig[key][th]){
        trig[key][th] = true;

/* 晋升判定盘：成功率按目标序列分档——9→8 约 80%、8→7 约 70%、7→6 约 60%；幸运 10/15/20 各 +10%/+20%/+25%。失败理智判定扣 20-80 随机。晋升需消耗金钱：序列9扣4、8扣5……5扣8 */
function judgeChance(){
  const s = state;
  const target = s.gifted ? Math.max(5, s.seq - 1) : 9;
  let c = target >= 8 ? 0.8 : target >= 7 ? 0.7 : target >= 6 ? 0.6 : 0.5;
  if (s.luck >= 20) c += 0.25;
  else if (s.luck >= 15) c += 0.20;
  else if (s.luck >= 10) c += 0.10;
  if (s.potionBonus) c += 0.1;          /* 魔药消化：小幅加成 */
  c += (s.mind - 100) / 200 * 0.05;     /* 理智带来的微薄镇定 */
  return Math.max(0.15, Math.min(0.95, c));
}
function setupJudgeStage(){
  if (state.godTrial && state.seq <= 1){
    state.growths.push('位格已至顶点：凡人晋升与你无关。');

  }
  state.stage = 'judge';

  const segs = segsFromWeights([

function storyPool(){
  const pk = periodKey();

  const usedIds = state.usedEvents || (state.usedEvents = []);

    if (e.period !== pk) return false;

    if (e.places && e.places.length && e.places.indexOf(pl) < 0) return false;

    return true;
  });
  /* 组织特殊事件（财富 20 加入组织后并入） */

      if (usedIds.indexOf(e.id) >= 0) return false;

    }).forEach(function(e){ if (pool.indexOf(e) < 0) pool.push(e); });
  }
  /* "我是谁？"：确认名字的特殊事件（各时代仅一次，命运必然） */
  if (!state.whoDone && usedIds.indexOf('whoami') < 0 && pool.length > 1){
    pool.push(WHOAMI_EVENT);

  /* 决定链事件（12-18 岁特殊事件专用：事件 → 决定 → 后果 → 再决定） */
  if (state.ageStage === 'teen'){
    DECISION_EVENTS.filter(function(e){
      if (e.period !== pk) return false;
      if (usedIds.indexOf(e.id) >= 0) return false;
      return true;
    }).forEach(function(e){ if (pool.indexOf(e) < 0) pool.push(e); });
  }
  /* 封印物的低语：持有序列≤3 的物品且尚未触发时，50% 概率注入（遇事件近半概率出现特殊选项） */
  if (state.sealDone !== true && usedIds.indexOf('seal') < 0 &&
      (state.items || []).some(function(it){ return it.seq <= 3; }) && Math.random() < 0.5){
    pool.push(SEAL_EVENT);

  /* 后续事件优先（下一年龄段默认继续发生） */
  const allEvents = EVENTS.concat(ORG_EVENTS).concat(FOLLOW_EVENTS);

    return ev && usedIds.indexOf(id) < 0;
  });
  if (!follows.length) return pool;
  const base = allEvents.filter(function(e){ return follows.indexOf(e.id) >= 0 && e.period === pk; });
  return base.concat(pool.filter(function(e){ return follows.indexOf(e.id) < 0; }));

function battleEnemyPool(){
  return { seq: 8, path: '污染兽', name: '失控的非凡生物' };
}
function setupBattleStage(){
  state.stage = 'battle';
  const ev = state.pendingEvent;
  const enemy = ev.battle === true ? { seq: ev.enemySeq, path: ev.enemyPath || '污染兽', name: ev.enemyName || '对手' } : battleEnemyPool();
  state.battle = { enemy: enemy, roundLeft: 0, skillEff: 0, enemyEff: 0 };
  const pSeq = state.gifted ? state.seq : 9;
  const eSeq = enemy.seq;
  const pw = Math.max(1, 10 - pSeq);
  const ew = Math.max(1, 10 - eSeq);
  const segs = segsFromWeights([
    { name:'你先手', w: pw, first: true, desc:'先机在手' },
    { name: enemy.name + ' 先手', w: ew, first: false, desc:'对手抢占先机' }
  ]);
  setupStage('战斗 · 先手判定', ev.name + ' — 你 vs ' + enemy.name + '（序列' + eSeq + '）', segs, '转动先手', function(d){
    state.battle.first = d.first;
    battleRounds();
  });
}
function battleRounds(){
  state.stage = 'battle';
  const segs = segsFromWeights(Array.from({length:6}, function(_, i){
    return { name: (i + 1) + ' 回合', w: 10, v: i + 1, desc: '出招的回合数' };
  }));
  setupStage('战斗 · 回合数', '这一战将持续几个回合（1-6 均分）', segs, '转动回合', function(d){
    state.battle.roundLeft = d.v;
    battlePickSkill();
  });
}
function battlePickSkill(){
  state.stage = 'battle';
  const b = state.battle;
  const myPath = state.gifted && state.pathway ? state.pathway.seq9 : '凡人';
  const pool = SKILL_POOL[myPath] || SKILL_POOL['凡人'];
  const segs = segsFromWeights(pool.map(function(x){
    return { name: x.name, w: 10, sk: x, desc: '效果 +' + x.eff + '% 胜率' };
  }));
  setupStage('战斗 · 你的出招', myPath + '途径的技能（' + b.roundLeft + ' 回合）', segs, '转动技能', function(d){
    b.skillEff += d.sk.eff;
    battleEnemySkill();
  });
}
function battleEnemySkill(){
  const b = state.battle;
  const ep = b.enemy.path || '污染兽';
  const pool = SKILL_POOL[ep] || SKILL_POOL['污染兽'];
  const sk = pick(pool);
  b.enemyEff += sk.eff;
  const btn = $('spin3');
  btn.disabled = false;
  btn.textContent = '对手出招 · ' + sk.name;
  stageHandler = function(){ battleVerdict(); };
  stageHandler.noSpin = true;
  showWheelResult('对手出招', sk.name + '：' + sk.desc + '（+' + sk.eff + '% 对手胜率）');
}
function battleVerdict(){
  state.stage = 'battle';
  const b = state.battle;
  const pSeq = state.gifted ? state.seq : 9;
  const eSeq = b.enemy.seq;
  const seqDiff = (10 - pSeq) - (10 - eSeq);
  let myW = 50 + seqDiff * 6 + b.skillEff - b.enemyEff
          + (state.courage - 5) * 2 + (state.luck - 5) * 1.5 + (state.constitution - 5) * 0.8;
  if (state.place && state.place.name === '白银城' && pSeq >= eSeq) myW += 10;
  myW = Math.max(10, Math.min(90, Math.round(myW)));
  const segs = segsFromWeights([
    { name:'你获胜', w: myW, win: true, desc:'胜率 ' + myW + '%' },
    { name:'你落败', w: 100 - myW, win: false, desc:'胜率 ' + (100 - myW) + '%' }
  ]);
  setupStage('战斗 · 胜负判定', '胜率 ' + myW + '%（技能与属性加成已计入）', segs, '转动胜负', function(d){
    b.win = d.win;
    b.winRate = myW;
    battleInjury();
  });
}
function battleInjury(){
  state.stage = 'battle';
  const b = state.battle;
  const rate = b.win ? b.winRate : 100 - b.winRate;
  const loser = b.win ? b.enemy.name : '你';
  const winner = b.win ? '你' : b.enemy.name;
  const segs = segsFromWeights([
    { name:'无伤', w: Math.max(10, 60 - rate * 0.25), tag:'无伤', desc:'' },
    { name:'轻伤', w: 30, tag:'轻伤', desc:'' },
    { name:'重伤', w: Math.max(6, 55 - rate * 0.5), tag:'重伤', desc:'' }
  ]);
  setupStage('战斗 · 伤势', winner + ' 获胜 · ' + loser + ' 的伤势', segs, '转动伤势', function(d){
    battleResolve(d.tag, loser, winner);
  });
}
function battleResolve(injury, loser, winner){
  const s = state;
  const b = state.battle;
  const pWin = b.win;
  const ev = state.pendingEvent;
  let msg = '战斗结束：' + winner + ' 获胜，' + loser + ' ' + injury + '。';
  if (pWin){
    s.courage = cap20(s.courage + 1);
    s.growths.push('战斗胜利：' + ev.name + '（勇气+1）');
    if (injury === '轻伤') s.constitution = Math.max(1, s.constitution - 1);
    if (injury === '重伤'){ s.constitution = Math.max(1, s.constitution - 2); s.mind = Math.max(60, s.mind - 15); }
    if (s.place && s.place.name === '白银城' && injury === '重伤') s.marks.push('带伤之躯');
    msg += (injury === '无伤' ? ' 你全身而退。' : injury === '轻伤' ? ' 你受了些皮外伤。' : ' 你伤得不轻。');
  } else {
    if (injury === '重伤'){
      if (s.halfGod){
        halfGodRescue(ev);
        return;
      }
      const escape = tryEscape();
      if (escape === 'escape'){ msg += ' 你奇迹般逃出生天。'; s.luck = cap20(s.luck + 1); s.marks.push('死里逃生'); }
      else if (escape === 'revive'){ msg += ' 序列的奇迹让你活了下来。'; s.marks.push('奇迹生还'); s.mind = Math.max(60, s.mind - 20); }
      else { s.constitution = Math.max(1, s.constitution - 2); s.mind = Math.max(60, s.mind - 20); s.marks.push('重伤缠身'); msg += ' 你重伤倒地，几乎丧命。'; }
    } else if (injury === '轻伤'){
      s.constitution = Math.max(1, s.constitution - 1);
      msg += ' 你带着伤退出了战斗。';
    }
    s.growths.push('战斗落败：' + ev.name + '（' + injury + '）');
  }
  renderModal();
  const btn = $('spin3');
  btn.disabled = false;
  if (s.storyLeft > 0){
    btn.textContent = '下一个事件';
    stageHandler = setupStoryStage;
    stageHandler.noSpin = true;
  } else {
    btn.textContent = '完成 · 查看猫先生';
    stageHandler = endYouthStory;
    stageHandler.noSpin = true;
  }
  showWheelResult('战果', msg);
}
function tryEscape(){
  const s = state;
  const p = s.gifted && s.pathway ? s.pathway.seq9 : '';
  if (p === '学徒' || p === '偷盗者'){
    return Math.random() < 0.6 ? 'escape' : 'fail';
  }
  if (p === '占卜家' && s.seq <= 6){
    return Math.random() < 0.5 ? 'revive' : 'fail';
  }
  return 'fail';
}
/* 高序列者救援：庇护者（美貌 20 结交的半神）在主角重伤濒死时现身，再开一场战斗 */
function halfGodRescue(ev){

function resolveItem(pathName, itemSeq){

    { name:'较小（几乎忽略）', w: odds[0], short:'轻微' },

/* ===== 结识挚友（人物转盘 → 关系转盘）===== */
function characterPool(){
  const pk = periodKey();
  const pl = state.place ? state.place.name : '';
  let pool = CHARACTERS.filter(function(c){
    if (c.eras.indexOf(pk) < 0) return false;
    if (c.places && c.places.length && c.places.indexOf(pl) < 0) return false;
    return true;
  });
  if (pool.length < 10){
    /* 保底：本时代人物不足 10 人时，从同代其余地点补齐 */
    const rest = CHARACTERS.filter(function(c){ return c.eras.indexOf(pk) >= 0 && pool.indexOf(c) < 0; });
    pool = pool.concat(rest);
  }
  if (!pool.length) pool = CHARACTERS.filter(function(c){ return c.eras.indexOf(pk) >= 0; });
  /* 高序列限流：特殊存在（阿蒙/亚当/愚者/罗塞尔等）综合权重 <= 5% */
  const spec = pool.filter(function(c){ return c.special; });
  const normal = pool.filter(function(c){ return !c.special; });
  const normalW = normal.reduce(function(a, c){ return a + c.w; }, 0);
  const curSpecW = spec.reduce(function(a, c){ return a + c.w; }, 0);
  if (spec.length && normalW > 0 && curSpecW / (normalW + curSpecW) > 0.05){
    const k = normalW * 5 / 95 / curSpecW;
    spec.forEach(function(c){ c._w = Math.max(0.3, Math.round(c.w * k * 10) / 10); });
  }
  return pool;
}
function rollFriend(){
  const pool = characterPool();
  const segs = segsFromWeights(pool.map(function(c){
    return { name: c.name, w: c._w || c.w, c: c, desc: c.title };
  }));
  setupStage('结识 · 人物之轮', '命运将你与谁引到一处（按诞生地点与时代）', segs, '转动人物', function(d){
    resolveFriend(d.c);

}

  if (s.org) rows += row('所属组织', s.org.name, s.org.desc);
  if (s.halfGod) rows += row('庇护者', s.halfGod.role + '·序列' + s.halfGod.seq, '重伤或濒死时现身');
  if (s.knowledgeGrace) rows += row('知识眷顾', '魔药寻路而来', '晋升线索即直接晋升');
  body.innerHTML = '<div class="stat-list">' + rows + '</div>';
  const g = $('shopGold'); if (g) g.textContent = s.wealth;
  const m = $('shopMerit'); if (m) m.textContent = s.merit || 0;
  const mb = $('meritBtn');
  if (mb) mb.disabled = !s.official;
  const san = $('catSan');
  if (san){
    const sanNum = $('sanNum');
    if (sanNum) sanNum.textContent = (s.mind || 0);
    san.className = 'cat-san ' + (s.mind >= 120 ? 'san-safe' : s.mind >= 90 ? 'san-danger' : 'san-mad');
  }
}
function row(k, v, d){
  return '<div class="stat-row"><span class="k">' + esc(k) + '</span>' +
    '<span class="v">' + esc(v) + (d ? '<small>' + esc(d) + '</small>' : '') + '</span></div>';
}

/* ===== 星空 canvas ===== */
(function(){
  const cvs = $('starfield'), ctx = cvs.getContext('2d');
  let W, H, stars = [];
  function resize(){
    W = cvs.width = window.innerWidth;
    H = cvs.height = window.innerHeight;
    stars = [];
    const n = Math.min(160, Math.floor(W * H / 9000));
    for (let i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + 0.4,
        base: 0.25 + Math.random() * 0.55,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.9
      });
    }
  }
  let raf = 0;
  function draw(t){
    ctx.clearRect(0, 0, W, H);
    for (const s of stars){
      const a = s.base * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
      ctx.globalAlpha = Math.max(0.08, a);
      ctx.fillStyle = '#dfe9f7';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!reduce.matches) raf = requestAnimationFrame(draw);
})();

function confirmWho(){
  const ans = ($('whoInput').value || '').trim();
  const s = state;
  s.whoDone = true;
  $('whoPanel').classList.remove('open');
  if (ans && ans === s.name){
    ['wisdom','beauty','constitution','courage','faith','mystery','luck'].forEach(function(k){
      s[k] = cap20(s[k] + 1);
    });
    s.mind = Math.max(60, s.mind - 20);
    s.marks.push('认清自我');
    s.growths.push('我是谁？：报上了名字——' + s.name + '（全属性+1，理智-20）');
    showWheelResult('我是谁', '镜中的人影终于与你同步。他（她）看着你，慢慢露出一个释然的微笑：「想起来了——你是「' + esc(s.name) + '」。」<br><em>自我认知 +1：全部基础属性 +1，但窥破迷障让理智 -20。</em>');
  } else {
    s.mind = Math.max(60, s.mind - 5);
    s.growths.push('我是谁？：沉默以对（理智-5）');
    showWheelResult('我是谁', '你张了张嘴，终究没有说出任何名字。镜中人影一点点淡去，仿佛从未出现过。你隐约觉得，自己错过了一次重要的确认——可你甚至说不上来，那是什么。');
  }
  const btn = $('spin3');
  btn.disabled = false;
  if (s.storyLeft > 0){
    btn.textContent = '下一个事件';
    stageHandler = setupStoryStage;
  } else {
    btn.textContent = '完成 · 查看猫先生';
    stageHandler = endYouthStory;
  }
  stageHandler.noSpin = true;
}
function skipWho(){
  const s = state;

  s.mind = Math.max(60, s.mind - 10);
  $('whoPanel').classList.remove('open');
  s.growths.push('我是谁？：装作没听见（理智-10）');
  showWheelResult('我是谁', '你垂下眼帘，装作没听见镜中的问话，快步离开了那面镜子。可整整三天，你都在反复回想那句话——「你还记得，自己是谁吗？」<br><em>你隐约觉得，有些东西开始变得模糊。</em>');
