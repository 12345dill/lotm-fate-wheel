<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运转盘 · 灰雾之上的开局</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 基础 ===== */
:root{
  --night:#05080f;
  --deep:#0a1226;
  --panel:#0e1a33;
  --panel2:#132142;
  --line:rgba(255,255,255,0.13);
  --ink:#efece3;
  --dim:#93a0b6;
  --blood:#d24a35;
  --blood-bright:#e8644c;
  --mist:rgba(178,196,228,0.13);
  --star:#dfe9f7;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(140vmax 96vmax at 72% -8%, rgba(23,41,88,0.55) 0%, rgba(23,41,88,0) 55%),
    radial-gradient(120vmax 88vmax at 14% 116%, rgba(13,27,52,0.65) 0%, rgba(13,27,52,0) 58%),
    linear-gradient(180deg, #081022 0%, #05080f 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(92vmax 58vmax at 50% 112%, rgba(175,195,228,0.10) 0%, rgba(175,195,228,0) 62%),
    radial-gradient(70vmax 44vmax at 84% 114%, rgba(158,180,220,0.08) 0%, rgba(158,180,220,0) 56%),
    radial-gradient(64vmax 40vmax at 12% 106%, rgba(170,190,225,0.07) 0%, rgba(170,190,225,0) 54%);
}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 18px 90px}

/* ===== 背景层：星空 ===== */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ===== 黑猫（左上角） ===== */
.cat-btn{
  position:fixed;top:16px;left:16px;z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:74px;
  transition:transform .25s ease;
}
.cat-btn:hover{transform:translateY(-3px) scale(1.04)}
.cat-badge{
  width:64px;height:64px;border-radius:50%;
  border:1px solid var(--line);
  background:radial-gradient(circle at 32% 28%, #1c2c52 0%, #0c1530 78%);
  box-shadow:0 6px 22px rgba(0,0,0,0.45), inset 0 0 18px rgba(120,150,220,0.10);
  overflow:hidden;position:relative;
}
.cat-badge img{width:100%;height:100%;object-fit:cover;display:block}
.cat-svg-fallback{position:absolute;inset:0;display:none}
.cat-name{
  font-size:11px;letter-spacing:.14em;color:var(--dim);
  background:rgba(10,18,38,0.72);border:1px solid var(--line);
  padding:2px 9px;border-radius:999px;white-space:nowrap;
}
.cat-dot{
  position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;
  background:var(--blood);border:2px solid #0a1226;
  box-shadow:0 0 10px rgba(210,74,53,0.8);
  transition:background .3s;
}
.journey-tip{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:#8fa3c4;line-height:1.7;text-align:center;margin:8px 0 2px}
.god-portrait{width:min(46vw,230px);display:block;margin:10px auto 8px;border-radius:10px;border:1px solid rgba(231,207,168,0.35);box-shadow:0 10px 30px rgba(0,0,0,0.55), 0 0 18px rgba(120,160,255,0.12)}
/* 理智大脑指示器（猫先生下方 · 绿=安全 黄=危险 红=疯狂） */
.cat-san{
  display:flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:999px;
  font-size:11px;letter-spacing:.05em;color:#cfe0f2;
  background:rgba(10,18,38,0.72);border:1px solid var(--line);
  white-space:nowrap;
  transition:background .4s, border-color .4s, box-shadow .4s;
}
.cat-san .san-num{font-variant-numeric:tabular-nums;font-weight:600}
.cat-san.san-safe{background:rgba(26,72,46,0.9);border-color:#5fa878;box-shadow:0 0 12px rgba(95,168,120,0.35)}
.cat-san.san-danger{background:rgba(108,86,24,0.92);border-color:#c9a03c;box-shadow:0 0 12px rgba(201,160,60,0.4)}
.cat-san.san-mad{background:rgba(122,36,36,0.95);border-color:#e86a5a;box-shadow:0 0 16px rgba(232,106,90,0.55);animation:sanPulse 1.5s ease-in-out infinite}
@keyframes sanPulse{0%,100%{opacity:1}50%{opacity:.7}}
.cat-btn.ready .cat-dot{background:#7fbf8f;box-shadow:0 0 10px rgba(127,191,143,0.8)}

/* ===== 右上角商店 ===== */
.hud{
  position:fixed;top:16px;right:16px;z-index:6;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
}
.hud-btn{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:#cfe0f2;
  background:linear-gradient(180deg, rgba(30,42,78,0.92), rgba(16,22,46,0.94));
  border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;transition:transform .2s, box-shadow .2s, opacity .2s;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);
}
.hud-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.5), 0 0 14px rgba(120,160,255,0.15)}
.hud-btn .hud-val{
  min-width:18px;text-align:center;font-variant-numeric:tabular-nums;
  color:var(--gold);font-weight:600;
}
.hud-btn.hud-locked{
  opacity:.45;cursor:not-allowed;filter:grayscale(0.7);
}
.hud-btn.hud-locked:hover{transform:none;box-shadow:0 4px 14px rgba(0,0,0,0.4)}
.hud-btn.hud-locked:disabled{pointer-events:auto}
.hud-btn svg{flex:none}

/* 商店弹窗 */
.shop-card{width:min(92vw,560px);max-height:82vh;display:flex;flex-direction:column}
.shop-tabs{display:flex;gap:8px;margin:2px 0 10px}
.shop-tab{
  flex:1;padding:8px 0;border-radius:10px;cursor:pointer;
  background:rgba(20,28,56,0.7);border:1px solid var(--line);
  color:#8fa3c4;font-family:var(--sans);font-size:12px;letter-spacing:.12em;
  transition:all .2s;
}
.shop-tab.active{color:var(--gold);border-color:rgba(231,207,168,0.55);background:rgba(40,50,90,0.75)}
.shop-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;flex:1}
.shop-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:rgba(18,26,52,0.72);border:1px solid rgba(120,150,220,0.14);
}
.shop-row .s-name{font-family:var(--serif);font-size:14px;color:#f2e2c4;letter-spacing:.08em;flex:none}
.shop-row .s-desc{font-size:11px;color:var(--dim);flex:1;line-height:1.5}
.shop-row .s-cost{
  font-size:11px;color:var(--gold);letter-spacing:.05em;flex:none;
  font-variant-numeric:tabular-nums;
}
.shop-row .s-buy{
  flex:none;padding:5px 12px;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#3a4d84,#24345e);
  border:1px solid rgba(231,207,168,0.35);color:#f2e2c4;
  font-family:var(--sans);font-size:11px;letter-spacing:.1em;
  transition:filter .15s;
}
.shop-row .s-buy:hover{filter:brightness(1.2)}
.shop-row .s-buy:disabled{opacity:.35;cursor:not-allowed;filter:none}
.shop-random{
  margin-top:10px;padding-top:10px;border-top:1px dashed rgba(120,150,220,0.25);
  display:flex;flex-direction:column;gap:8px;
}
.shop-random-head{
  font-size:11px;letter-spacing:.16em;color:#8fa3c4;
  display:flex;justify-content:space-between;align-items:center;
}
.shop-random-head em{font-style:normal;color:#7fbf8f;font-size:10.5px}
.shop-random-head b{color:var(--gold);font-weight:600}
.shop-random .r-item{
  padding:9px 11px;border-radius:10px;
  background:linear-gradient(180deg, rgba(30,40,74,0.7), rgba(16,22,46,0.7));
  border:1px solid rgba(231,207,168,0.18);font-size:11.5px;color:#cfe0f2;line-height:1.55;
}
.shop-random .r-item b{color:var(--gold);font-family:var(--serif);font-weight:400;letter-spacing:.06em}

/* ===== 头部 ===== */
header{text-align:center;margin:26px 0 10px;max-width:900px}
.eyebrow{
  font-size:12px;letter-spacing:.42em;color:var(--dim);
  display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px;
}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--line))}
.eyebrow::after{background:linear-gradient(90deg,var(--line),transparent)}
h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(34px,6vw,54px);letter-spacing:.2em;text-indent:.2em;
  color:#f4f1e8;
  text-shadow:0 0 34px rgba(210,74,53,0.22), 0 2px 18px rgba(0,0,0,0.6);
}

/* ===== 舞台 ===== */
.stage{
  display:flex;flex-direction:column;gap:48px;justify-content:flex-start;align-items:center;
  margin-top:34px;width:100%;max-width:1060px;
}
/* 姓名面板 */
.name-panel{
  display:flex;align-items:center;gap:14px;width:min(88vw,420px);
  padding:14px 20px;border-radius:14px;
  background:linear-gradient(180deg, rgba(38,46,84,0.5), rgba(20,22,48,0.72));
  border:1px solid rgba(231,207,168,0.22);
  box-shadow:inset 0 0 30px rgba(120,160,255,0.06);
  position:relative;
}
.name-panel.hide{display:none}
.name-panel::before{
  content:"";position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg, transparent, rgba(231,207,168,0.5), transparent);
}
/* 旅途准备面板 */
.journey-panel{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:34px 26px 30px;border-radius:20px;width:min(92vw,520px);
  background:linear-gradient(180deg, rgba(26,36,70,0.55), rgba(12,18,42,0.85));
  border:1px solid rgba(120,150,220,0.22);
  box-shadow:0 18px 50px rgba(0,0,0,0.45), inset 0 0 60px rgba(120,160,255,0.05);
}
.journey-panel.hide{display:none}
.journey-title{
  font-family:var(--serif);font-size:20px;letter-spacing:.5em;color:var(--gold);
  text-shadow:0 0 18px rgba(231,207,168,0.35);padding-left:.5em;
}
.journey-desc{
  text-align:center;color:#8fa3c4;font-size:12.5px;line-height:2;letter-spacing:.08em;
}
.journey-tip{font-size:11px;color:#5c6b85;letter-spacing:.1em}
.journey-go{
  font-size:15px;padding:12px 46px;letter-spacing:.35em;padding-left:calc(46px + .35em);
}
.journey-go::after{
  content:"";position:absolute;left:46px;right:46px;bottom:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(231,207,168,0.5), transparent);
}
.name-label{
  font-family:var(--serif);font-size:14px;letter-spacing:.28em;color:#d8c39a;white-space:nowrap;
}
#nameInput{
  flex:1;min-width:0;background:rgba(10,12,30,0.7);
  border:1px solid rgba(231,207,168,0.28);border-radius:9px;
  color:#f2e2c4;font-family:var(--serif);font-size:16px;letter-spacing:.18em;
  padding:9px 14px;outline:none;transition:border-color .25s, box-shadow .25s;
}
#nameInput:focus{border-color:rgba(231,207,168,0.65);box-shadow:0 0 0 3px rgba(231,207,168,0.08)}
#nameInput::placeholder{color:rgba(185,169,140,0.5);letter-spacing:.1em;font-size:13px}
.dice-btn{
  width:46px;height:46px;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%, rgba(231,207,168,0.16), rgba(20,22,48,0.9));
  border:1px solid rgba(231,207,168,0.4);border-radius:12px;color:#e7cfa8;cursor:pointer;
  transition:transform .15s ease, box-shadow .25s ease, border-color .25s;
}
.dice-btn:hover{transform:translateY(-2px) rotate(-6deg);border-color:#e7cfa8;box-shadow:0 6px 18px rgba(0,0,0,0.35), 0 0 14px rgba(231,207,168,0.18)}
.dice-btn:active{transform:scale(0.92)}
.dice-btn.rolling{animation:diceShake .5s ease}
@keyframes diceShake{
  0%{transform:rotate(0) translateY(0)} 20%{transform:rotate(-24deg) translateY(-3px)}
  45%{transform:rotate(20deg) translateY(2px)} 70%{transform:rotate(-12deg) translateY(-1px)}
  100%{transform:rotate(0) translateY(0)}
}
.name-read{
  font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:rgba(185,169,140,0.75);
  white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;
}
.wheel-wrap{
  position:relative;width:min(78vw,360px);
  display:flex;flex-direction:column;align-items:center;gap:20px;
  touch-action:none;
}
.wheel-wrap.hidden{display:none}
.wheel-wrap.enter{animation:wheelIn .7s cubic-bezier(0.2,0.8,0.3,1) both}
.wheel-wrap.fade-out{
  opacity:0;transform:translateY(-18px) scale(0.98);
  transition:opacity .45s ease, transform .45s ease;
}
@keyframes wheelIn{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
.wheel-frame{position:relative;width:100%;aspect-ratio:1/1}
.wheel-frame::before{
  content:"";position:absolute;inset:-14px;border-radius:50%;
  background:radial-gradient(circle, rgba(90,120,200,0.16) 0%, rgba(10,18,38,0) 66%);
  filter:blur(6px);
}
.wheel-frame::after{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.20);
  box-shadow:0 0 0 6px rgba(8,14,30,0.55), 0 10px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(10,18,40,0.55);
}
.wheel-svg{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  transition:transform 8.2s cubic-bezier(0.12,0.82,0.14,1);
  will-change:transform;
}
.wheel-svg text{pointer-events:none}
.pointer{
  position:absolute;top:-12px;left:50%;z-index:4;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:27px solid #d8b981;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,0.65));
}
.pointer::after{
  content:"";position:absolute;top:-33px;left:-5px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f5e6c4, #c9a76a 78%);
  box-shadow:0 0 8px rgba(232,207,168,0.75);
}
.wheel-hub{
  position:absolute;left:50%;top:50%;z-index:3;
  width:56px;height:56px;transform:translate(-50%,-50%);
  border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 30%, #22345f 0%, #0b142c 74%);
  border:1px solid rgba(255,255,255,0.35);
  box-shadow:0 0 0 5px rgba(8,14,30,0.6), 0 4px 16px rgba(0,0,0,0.5), inset 0 0 14px rgba(90,120,200,0.25);
}
.wheel-hub svg{width:26px;height:26px}
.wheel-title{
  font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--dim);
  text-align:center;
}
.wheel-title strong{display:block;font-size:18px;color:var(--ink);letter-spacing:.24em;font-weight:700;margin-bottom:4px}
.wheel-result{
  position:relative;z-index:2;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:100%;padding:6px 14px;border-radius:10px;text-align:center;
  font-family:var(--serif);font-size:17px;letter-spacing:.14em;color:#f2e2c4;
  background:linear-gradient(90deg, rgba(231,207,168,0.05), rgba(231,207,168,0.13), rgba(231,207,168,0.05));
  border:1px solid rgba(231,207,168,0.18);
  opacity:0;transform:translateY(-8px);
  transition:opacity .45s ease, transform .45s ease;
}
.wheel-result.show{opacity:1;transform:translateY(0)}
.wheel-result small{
  font-family:var(--sans);font-size:13px;letter-spacing:.04em;color:#b9a98c;
  line-height:1.75;max-height:178px;overflow-y:auto;text-align:center;
  padding:2px 4px;
}
.wheel-result .story-title{
  font-family:var(--serif);font-size:16px;letter-spacing:.16em;color:#f2e2c4;
  margin-bottom:2px;
}
.wheel-result .story-title.story-danger{color:#e86a5a;text-shadow:0 0 12px rgba(232,106,90,0.4)}
.wheel-result .story-title.story-gold{color:#e7cfa8;text-shadow:0 0 12px rgba(231,207,168,0.35)}
.wheel-result small em{font-style:normal;color:#d8b98a;letter-spacing:.06em}
.wheel-result small::-webkit-scrollbar{width:4px}
.wheel-result small::-webkit-scrollbar-thumb{background:rgba(231,207,168,0.25);border-radius:2px}
/* 转盘星光背景 */
.wheel-wrap::before{
  content:"";position:absolute;inset:-30px -44px;z-index:0;pointer-events:none;
  background:
    radial-gradient(2px 2px at 12% 20%, rgba(255,255,255,0.9), transparent 62%),
    radial-gradient(1.5px 1.5px at 30% 10%, rgba(255,255,255,0.55), transparent 62%),
    radial-gradient(1px 1px at 46% 28%, rgba(255,255,255,0.75), transparent 62%),
    radial-gradient(2px 2px at 68% 14%, rgba(255,255,255,0.6), transparent 62%),
    radial-gradient(1.5px 1.5px at 84% 38%, rgba(255,255,255,0.85), transparent 62%),
    radial-gradient(1px 1px at 16% 58%, rgba(255,255,255,0.5), transparent 62%),
    radial-gradient(2px 2px at 56% 66%, rgba(255,255,255,0.7), transparent 62%),
    radial-gradient(1.5px 1.5px at 82% 72%, rgba(255,255,255,0.55), transparent 62%),
    radial-gradient(1px 1px at 38% 86%, rgba(255,255,255,0.75), transparent 62%),
    radial-gradient(2px 2px at 90% 86%, rgba(255,255,255,0.5), transparent 62%),
    radial-gradient(1px 1px at 6% 38%, rgba(232,207,168,0.65), transparent 62%),
    radial-gradient(1.5px 1.5px at 24% 92%, rgba(232,207,168,0.55), transparent 62%),
    radial-gradient(1px 1px at 74% 52%, rgba(170,200,255,0.5), transparent 62%);
  opacity:.6;animation:starTwinkle 4.2s ease-in-out infinite alternate;
}
@keyframes starTwinkle{
  from{opacity:.32}
  to{opacity:.72}
}
.wheel-wrap > *{position:relative;z-index:1}

/* ===== 按钮 ===== */
.btn-main{
  font-size:16px;letter-spacing:.22em;font-weight:500;color:#fff;
  background:linear-gradient(180deg, var(--blood-bright), var(--blood));
  padding:15px 34px;border-radius:999px;
  box-shadow:0 8px 26px rgba(210,74,53,0.34), inset 0 1px 0 rgba(255,255,255,0.28);
  transition:transform .18s ease, box-shadow .18s ease, opacity .18s;
  min-height:52px;
}
.btn-main:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(210,74,53,0.44)}
.btn-main:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.btn-ghost{
  font-size:13px;letter-spacing:.2em;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;
  padding:10px 24px;transition:color .2s,border-color .2s;min-height:44px;
}
.btn-ghost:hover{color:var(--ink);border-color:rgba(255,255,255,0.32)}
.spin-hint{font-size:12.5px;color:var(--dim);letter-spacing:.08em;line-height:1.7;text-align:center;min-height:22px}

/* ===== 结果区 ===== */
.result{width:100%;max-width:1060px;margin-top:44px;display:flex;flex-direction:column;gap:20px}
.guide{
  text-align:center;padding:34px 26px;border:1px dashed var(--line);border-radius:16px;
  color:var(--dim);font-size:14px;letter-spacing:.1em;line-height:2.1;
}
.rcard{
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:22px 24px;
  position:relative;overflow:hidden;
}
/* 转盘标题下方的副标题小字、按钮下方提示行——全部隐藏 */
.wheel-title span{display:none}
.wheel-title span.era-note{display:inline-block;font-size:11px;color:#8fb7d6;letter-spacing:.18em;font-family:var(--sans);font-weight:400;margin-left:10px;opacity:.85}
.spin-hint{display:none}

.rcard::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, transparent, rgba(210,74,53,0.6), transparent);
}
.rcard.major{
  border-color:rgba(210,74,53,0.55);
  background:linear-gradient(180deg, rgba(60,20,28,0.55), rgba(20,14,26,0.9));
  box-shadow:inset 0 0 46px rgba(210,74,53,0.08);
}
.rcard.major::before{background:linear-gradient(90deg, transparent, var(--blood-bright), transparent);height:3px}
.rcard.major .kicker{color:#f2a08c}
.wheel-svg{will-change:transform}
.wheel-svg.spinning{
  filter:drop-shadow(0 0 14px rgba(120,160,255,0.35));
  animation:wheelGlow 1.1s ease-in-out infinite alternate;
}
@keyframes wheelGlow{
  from{filter:drop-shadow(0 0 8px rgba(120,160,255,0.22))}
  to{filter:drop-shadow(0 0 22px rgba(120,160,255,0.55))}
}
.wheel-svg path.lit{
  fill-opacity:.5;stroke:#e7cfa8;stroke-width:2.4;
  transition:fill-opacity .5s ease, stroke .5s ease;
}
.wheel-hub svg{animation:hubSpin 9s linear infinite}
@keyframes hubSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.rcard.reveal{animation:cardReveal .6s cubic-bezier(0.2,0.9,0.3,1.15) both}
@keyframes cardReveal{
  0%{opacity:0;transform:translateY(14px) scale(0.96)}
  70%{opacity:1;transform:translateY(-2px) scale(1.005)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.rcard.reveal::after{
  content:"";position:absolute;top:-2px;left:0;right:0;height:2px;
  background:linear-gradient(90deg, transparent, rgba(231,207,168,0.9), transparent);
  animation:shimmer 1.1s ease 0.25s both;
}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* 试炼卡：AI 命运演算 */
.trial-card{position:relative}
.trial-odds{
  margin-top:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;padding:12px 14px;
}
.trial-bar{height:7px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:8px}
.trial-bar i{
  display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg, #3d6bb5, #e7cfa8);
  transition:width 1.2s cubic-bezier(0.2,0.8,0.3,1);
}
.trial-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.06em;margin-top:9px}
.trial-verdict{margin-top:12px;font-size:13px;letter-spacing:.08em;color:#e7cfa8}

/* 命运足迹：一行记录，无方框 */
.fp{
  font-size:13px;color:var(--dim);letter-spacing:.06em;line-height:2;
  display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;
  padding:2px 2px;
}
.fp-cap{color:var(--dim);letter-spacing:.24em;font-size:11px}
.fp-item{color:#c9d4e6}
.fp-item em{font-style:normal;color:#e7cfa8;margin-left:6px;font-size:12px}
.kicker{
  font-size:11px;letter-spacing:.34em;color:var(--blood-bright);
  margin-bottom:8px;text-transform:uppercase;
}
.rcard h2{
  font-family:var(--serif);font-size:clamp(20px,3vw,26px);font-weight:700;
  letter-spacing:.06em;color:var(--ink);
}
.rcard .desc{color:var(--dim);font-size:14px;line-height:1.95;margin-top:10px;max-width:640px}
.bonus-tag{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;font-size:12.5px;color:#e7cfa8;
  border:1px solid rgba(231,207,168,0.32);border-radius:999px;
  padding:4px 13px;background:rgba(231,207,168,0.06);
}
.bonus-tag svg{width:13px;height:13px}
.dev-note{
  margin-top:12px;font-size:12.5px;color:#a9b6cc;letter-spacing:.05em;
  border-top:1px dashed var(--line);padding-top:12px;line-height:1.8;
}

/* 属性卡 */
.cards-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;
}
.attr-card{
  background:linear-gradient(180deg, rgba(22,36,70,0.85), rgba(12,22,44,0.9));
  border:1px solid var(--line);border-radius:14px;padding:18px 16px;
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease, transform .5s ease;
}
.attr-card.show{opacity:1;transform:translateY(0)}
.attr-card .k{font-size:11px;letter-spacing:.3em;color:var(--dim)}
.attr-card .v{
  font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);
  margin-top:8px;letter-spacing:.04em;
}
.attr-card .d{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.7}
.attr-card .add{font-size:12px;color:#e7cfa8;margin-top:8px}
.attr-card.hot{border-color:rgba(210,74,53,0.5)}
.attr-card.hot .v{color:#f4d9c8}

/* 命运值 */
.fate-card{text-align:center;padding:30px 24px}
.fate-num{
  font-family:var(--serif);font-size:clamp(46px,7vw,64px);font-weight:900;
  color:#f4f1e8;line-height:1.1;
  text-shadow:0 0 30px rgba(210,74,53,0.3);
}
.fate-num span{font-size:clamp(18px,2.6vw,24px);color:var(--dim);font-weight:400;margin-left:6px}
.fate-verdict{font-size:15px;letter-spacing:.12em;color:#e7cfa8;margin-top:10px}
.fate-best{margin-top:14px;font-size:12.5px;color:var(--dim);letter-spacing:.08em}
.fate-actions{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* ===== 模态 ===== */
.modal-mask{
  position:fixed;inset:0;z-index:10;background:rgba(3,6,14,0.72);
  backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal-card{
  width:min(560px,94vw);max-height:82vh;overflow-y:auto;
  background:linear-gradient(180deg, #12203f, #0a1428);
  border:1px solid rgba(255,255,255,0.16);border-radius:20px;
  padding:26px 26px 22px;position:relative;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  transform:translateY(16px) scale(0.98);transition:transform .32s cubic-bezier(0.2,0.9,0.3,1.2);
}
.modal-mask.open .modal-card{transform:translateY(0) scale(1)}
.modal-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.modal-cat{
  width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;
  border:1px solid var(--line);
  background:radial-gradient(circle at 32% 28%, #1c2c52, #0c1530);
}
.modal-cat img{width:100%;height:100%;object-fit:cover;display:block}
.modal-head h3{font-family:var(--serif);font-size:19px;letter-spacing:.06em;color:var(--ink)}
.modal-head p{font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.06em}
.modal-close{
  position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;  border:1px solid var(--line);color:var(--dim);font-size:15px;
  display:grid;place-items:center;transition:all .2s;
}
.modal-close:hover{color:var(--ink);border-color:rgba(255,255,255,0.4)}
.luck-cat{
  display:grid;place-items:center;font-size:26px;color:#e8c96a;
  background:radial-gradient(circle at 32% 28%, #3a3220, #171207);
}
.luck-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}
.luck-opt{
  text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
  transition:all .18s;font-family:inherit;
}
.luck-opt:hover{background:rgba(232,201,106,0.12);border-color:rgba(232,201,106,0.5);transform:translateY(-1px)}
.luck-opt b{display:block;color:var(--ink);font-size:13px;letter-spacing:.05em;margin-bottom:3px}
.luck-opt span{display:block;color:var(--dim);font-size:11px;line-height:1.55}
/* 我是谁？面板 */
.who-quote{
  margin:6px 0;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.9;
  color:#c9d6ea;background:rgba(20,26,52,0.6);border:1px solid rgba(120,150,220,0.18);
  text-align:center;letter-spacing:.05em;
}
#whoPanel .modal-card{
  display:flex;flex-direction:column;gap:12px;width:min(92vw,420px);
}
#whoPanel input{
  width:100%;padding:11px 14px;border-radius:10px;font-size:15px;text-align:center;
  background:rgba(10,14,34,0.8);border:1px solid rgba(231,207,168,0.3);color:#f0e6d2;
  outline:none;letter-spacing:.12em;
}
#whoPanel input:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(231,207,168,0.25)}
.who-actions{display:flex;justify-content:center;gap:12px;margin-top:2px}
.who-actions .btn-main{padding:9px 26px;font-size:13px;letter-spacing:.25em}
.btn-ghost{
  padding:9px 20px;border-radius:12px;font-size:12.5px;letter-spacing:.15em;color:#8fa3c4;
  background:transparent;border:1px solid rgba(120,150,220,0.3);cursor:pointer;transition:.25s;
}
.btn-ghost:hover{color:#c9d6ea;border-color:rgba(120,150,220,0.6)}
.empty-state{
  text-align:center;padding:30px 10px;color:var(--dim);
  font-size:13.5px;letter-spacing:.1em;line-height:2.1;
}
.stat-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.stat-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:9px 13px;border-radius:10px;background:rgba(255,255,255,0.04);
  font-size:13.5px;
}
.stat-row .k{color:var(--dim);letter-spacing:.1em;flex:none}
.stat-row .v{color:var(--ink);text-align:right;line-height:1.6}
.stat-row .v small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.foot-list{display:block;text-align:left;line-height:1.9}
.foot-item{font-size:12.5px;color:#c9d4e6}
.foot-item::before{content:'· ';color:#e7cfa8}
.stat-row.total{background:rgba(210,74,53,0.10);border:1px solid rgba(210,74,53,0.35)}
.stat-row.total .v{font-family:var(--serif);font-weight:700;font-size:16px;color:#f4d9c8}
.breakdown{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.breakdown-title{font-size:11px;letter-spacing:.26em;color:var(--dim);margin-bottom:8px}
.bd-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);padding:4px 2px}
.bd-row .p{color:#e7cfa8}

/* ===== 页脚 ===== */
footer{
  margin-top:56px;font-size:11px;color:#5c6b85;letter-spacing:.12em;text-align:center;
  line-height:2;padding:0 20px;
}

/* ===== 响应式 ===== */
@media (max-width:760px){
  .stage{flex-direction:column;align-items:center;gap:44px}
  .wheel-wrap{width:min(84vw,340px)}
  .cat-btn{width:60px}
  .cat-badge{width:54px;height:54px}
  .cards-grid{grid-template-columns:1fr 1fr}
  #app{padding-top:16px}
  .modal-card{padding:20px 18px 18px}
}
@media (max-width:420px){
  .cards-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  .wheel-svg{transition-duration:0.01ms}
  .attr-card{transition:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>

<div id="app">
  <!-- 黑猫 -->
  <button class="cat-btn" id="catBtn" aria-label="打开猫先生的状态面板">
    <span class="cat-badge">
      <img id="catImg" src="images/cat.png" alt="戴礼帽的神秘黑猫">
      <span class="cat-svg-fallback" id="catFallback"></span>
      <span class="cat-dot" id="catDot"></span>
    </span>
    <span class="cat-name">猫先生</span>
    <span class="cat-san" id="catSan" title="理智值 · 安全为绿，危险为黄，疯狂为红">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M12 3a4.2 4.2 0 0 0-1.2 8.25A3.6 3.6 0 0 0 8 14.6c0 .6.15 1.2.42 1.7A3.4 3.4 0 0 0 8.7 20 3.2 3.2 0 0 0 12 21.4 3.2 3.2 0 0 0 15.3 20a3.4 3.4 0 0 0 .28-3.7c.27-.5.42-1.1.42-1.7a3.6 3.6 0 0 0-2.8-3.35A4.2 4.2 0 0 0 12 3z"/></svg>
      <span class="san-num" id="sanNum">—</span>
    </span>
  </button>

  <!-- 右上角商店 -->
  <div class="hud" id="hud">
    <button class="hud-btn" id="shopBtn" title="金钱商店——用钱袋里的金币换取命运" aria-label="金钱商店">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="5" stroke-linejoin="round"/>
        <path d="M12 5v14M7 9.5c1.5-1 10-1 10 0M7 14.5c1.5 1 10 1 10 0" stroke-linecap="round"/>
      </svg>
      <span class="hud-val" id="shopGold">0</span>
    </button>
    <button class="hud-btn hud-locked" id="meritBtn" title="功绩商店——加入官方非凡者后开启" aria-label="功绩商店" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
        <polygon points="12,3 14.5,8 20,8.8 16,12.6 17,18 12,15.3 7,18 8,12.6 4,8.8 9.5,8" stroke-linejoin="round"/>
      </svg>
      <span class="hud-val" id="shopMerit">0</span>
    </button>
  </div>

  <header>
    <div class="eyebrow">灰 雾 之 上</div>
    <h1>命运转盘</h1>
  </header>

  <main class="stage">
    <!-- 旅途准备：姓名 + 开始旅途（单独在最前，点击后才进入转盘） -->
    <div class="journey-panel" id="journeyPanel">
      <div class="journey-title">开 始 之 前</div>
      <p class="journey-desc">灰雾之上，命运尚未翻开。<br>先留下你的名字——它将被写入第一页。</p>

      <div class="name-panel" id="namePanel">
        <span class="name-label">你的姓名</span>
        <input id="nameInput" maxlength="12" autocomplete="off" placeholder="输入姓名，或投一枚命运骰">
        <button class="dice-btn" id="nameDice" title="投 20 面骰，让命运替你起名">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
            <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
            <path d="M12 2v8M3 7l9 5M21 7l-9 5M3 17l9-5M21 17l-9-5" stroke-linecap="round" opacity="0.45"/>
          </svg>
        </button>
        <span class="name-read" id="nameRead"></span>
      </div>
      <button class="btn-main journey-go" id="journeyGo">开 始 旅 途</button>
    </div>

    <!-- 性别转盘：名字之后、身份之前 -->
    <section class="wheel-wrap hidden" id="genderWrap" aria-label="性别转盘">
      <div class="wheel-title"><strong>你的性别</strong></div>
      <div class="wheel-result" id="genderResult"></div>
      <div class="wheel-frame">
        <div class="pointer"></div>
        <svg class="wheel-svg" id="wheelGender" viewBox="0 0 300 300" role="img" aria-label="性别转盘"></svg>
        <div class="wheel-hub"><svg viewBox="0 0 24 24" fill="none" stroke="#e7cfa8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></div>
      </div>
      <button class="btn-main" id="spinGender">转动命运之轮</button>
    </section>

    <!-- 转盘一：身份 -->
    <section class="wheel-wrap hidden" id="wheel1Wrap" aria-label="身份转盘">
      <div class="wheel-title"><strong>你的身份</strong></div>
      <div class="wheel-result" id="wheel1Result"></div>
      <div class="wheel-frame">
        <div class="pointer"></div>
        <svg class="wheel-svg" id="wheel1" viewBox="0 0 300 300" role="img" aria-label="身份转盘"></svg>
        <div class="wheel-hub"><svg viewBox="0 0 24 24" fill="none" stroke="#e7cfa8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></div>
      </div>
      <button class="btn-main" id="spin1">转动命运之轮</button>
    </section>

    <!-- 转盘二：按身份动态（纪元 / 知识污染判定） -->
    <section class="wheel-wrap hidden" id="wheel2Wrap" aria-label="第二转盘">
      <div class="wheel-title"><strong id="wheel2Title">纪元之轮</strong><span id="wheel2Sub">第一纪 · 混沌　至　第五纪 · 黑铁</span></div>
      <div class="wheel-result" id="wheel2Result"></div>
      <div class="wheel-frame">
        <div class="pointer"></div>
        <svg class="wheel-svg" id="wheel2" viewBox="0 0 300 300" role="img" aria-label="纪元转盘"></svg>
        <div class="wheel-hub"><svg viewBox="0 0 24 24" fill="none" stroke="#e7cfa8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></div>
      </div>
      <button class="btn-main" id="spin2">转动纪元之轮</button>
    </section>

    <!-- 动态阶段转盘：时代 → 背景连转 → 成长 → 物品 → 关系 -->
    <section class="wheel-wrap hidden" id="wheel3Wrap" aria-label="阶段转盘">
      <div class="wheel-title"><strong id="wheel3Title">时代之轮</strong><span id="wheel3Sub"></span></div>
      <div class="wheel-result" id="wheel3Result"></div>
      <div class="wheel-frame">
        <div class="pointer"></div>
        <svg class="wheel-svg" id="wheel3" viewBox="0 0 300 300" role="img" aria-label="阶段转盘"></svg>
        <div class="wheel-hub"><svg viewBox="0 0 24 24" fill="none" stroke="#e7cfa8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></div>
      </div>
      <button class="btn-main" id="spin3">转动</button>
    </section>
  </main>

  <div class="fate-actions" style="margin-top:26px">
    <button class="btn-ghost" id="restart">重新开始</button>
  </div>

  <footer>非商业粉丝向作品 · 背景设定源自《诡秘之主》（爱潜水的乌贼）· 仅供同好娱乐</footer>
</div>

<!-- 猫先生状态面板 -->
<div class="modal-mask" id="catModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="猫先生的状态面板">
    <button class="modal-close" id="closeModal" aria-label="关闭">×</button>
    <div class="modal-head">
      <div class="modal-cat"><img id="catImgModal" src="images/cat.png" alt=""></div>
      <div>
        <h3>猫先生 · 命运记录</h3>
        <p id="modalSub">灰雾之上的观测者，黑猫，戴礼帽。</p>
      </div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- 天选之人 · 自选奖励 -->
<div class="modal-mask" id="luckPanel">
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="天选之人自选奖励">
    <button class="modal-close" id="closeLuck" aria-label="关闭">×</button>
    <div class="modal-head">
      <div class="modal-cat luck-cat">★</div>
      <div>
        <h3>天选之人</h3>
        <p>幸运触及凡人的极限——命运的馈赠，任你挑选一份。</p>
      </div>
    </div>
    <div id="luckGrid" class="luck-grid"></div>
  </div>
</div>

<!-- 我是谁？ · 名字确认 -->
<div class="modal-mask" id="whoPanel">
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="我是谁">
    <div class="modal-head">
      <div class="modal-cat luck-cat">◉</div>
      <div>
        <h3>我是谁？</h3>
        <p>镜中的你慢了半拍，缓缓开口——</p>
      </div>
    </div>
    <p class="who-quote">「你还记得……自己是谁吗？说出你的名字。」</p>
    <input id="whoInput" maxlength="12" autocomplete="off" placeholder="在此输入你的名字">
    <div class="who-actions">
      <button class="btn-main" id="whoConfirm">报上名字</button>
      <button class="btn-ghost" id="whoSkip">装作没听见</button>
    </div>
  </div>
</div>

<!-- 商店（金钱 / 功绩） -->
<div class="modal-mask" id="shopModal">
  <div class="modal-card shop-card" role="dialog" aria-modal="true" aria-label="商店">
    <button class="modal-close" id="closeShop" aria-label="关闭">×</button>
    <div class="modal-head">
      <div class="modal-cat luck-cat">◈</div>

function itemBasePrice(seq){
  /* 序列9：10 金±2；序列8：15 金±2；其余序列按梯度递增 */
  const base = { 9:[10,2], 8:[15,2], 7:[20,3], 6:[28,4], 5:[38,5], 4:[50,6], 3:[65,8], 2:[85,10], 1:[120,15] }[seq] || [10,2];
  return base[0] + Math.floor(Math.random() * (base[1] * 2 + 1)) - base[1];
}
function itemFinalPrice(item){
  let p = item.price;
  if (state.luck >= 15) p = p * 0.7;        /* 幸运 15：减 30%（四舍五入） */
  else if (state.luck >= 10) p = p * 0.8;   /* 幸运 10：减 20%（四舍五入） */
  return Math.max(1, Math.round(p));
}
function rollShopItem(poolKey){
  /* 序列权重：9/8/7 占 90%+；poolKey='merit' 时高序列概率大幅提升 */
  let WEIGHTS = { 9:40, 8:30, 7:20, 6:6, 5:2.5, 4:1, 3:0.3, 2:0.15, 1:0.05 };
  if (poolKey === 'merit') WEIGHTS = { 9:20, 8:18, 7:16, 6:14, 5:10, 4:8, 3:6, 2:4, 1:4 };
  const seqs = Object.keys(WEIGHTS).map(Number);
  const total = seqs.reduce(function(a, s){ return a + WEIGHTS[s]; }, 0);
  let r = Math.random() * total, picked = 9;
  for (let i = 0; i < seqs.length; i++){
    r -= WEIGHTS[seqs[i]];
    if (r <= 0){ picked = seqs[i]; break; }
  }
  const arr = ITEM_POOL_BY_SEQ[picked];
  const it = Object.assign({ seq: picked }, pick(arr));
  it.price = itemBasePrice(it.seq);
  return it;
}

          { text:'打听大帝的日记', result:{ attr:{mystery:1, wisdom:1}, text:'你旁敲侧击地打听大帝的日记。船长沉默半晌，从怀里摸出一本翻旧的册子——扉页上写满你从未见过的文字，像符号又像图画。他飞快地合上：「有些字，看了要折寿。」你只瞥见一眼，却记了很久。神秘+1、智慧+1' } }

      { text:'婉拒，留在王都', next:{ title:'梦中的船队', text:'你回信婉拒了。当晚你梦见一支船队在风暴中航行，甲板上空无一人，只有桅杆上挂着的黄玫瑰在风里摇晃。醒来时你出了一身冷汗，不知道自己错过的是什么。',
        decisions:[
          { text:'写信请求随行', result:{ attr:{wisdom:1}, text:'你连夜写了一封长信，托驿站加急送去。回信的人说：船队已远航，但你的信被收进了王都档案馆，「编号七千零三」。你常常想，那封信或许某天会被人翻出来——就像你翻出的那些旧事。智慧+1' } },
          { text:'留在原地，过安稳日子', result:{ attr:{mind:5}, text:'你把请柬收进抽屉最底层。日子一天天过去，港口每天都有船进出，你渐渐不再去想那支船队。某个深夜你忽然惊醒，只记得梦里全是扬起的帆。理智+5' } }

          { text:'偷偷翻看机密卷宗', next:{ title:'通往神明的阶梯', text:'你趁夜翻开了那卷贴着封条的卷宗。里面记载着一段被涂抹的航线，旁边批注：「通往神明的阶梯。」你的手在发抖，眼睛却挪不开。',

    { name:'蒸汽机轰鸣', year:'第五纪 1186 年', text:'罗塞尔大帝的蒸汽机在港口轰鸣起来。黑烟滚滚，码头工人第一次看见「不用马拉的车」。你挤在人群里，被蒸汽烫了一下手——很多年后，你仍记得那种灼痛和兴奋。', reward:'智慧+1', attr:{wisdom:1} },
    { name:'北境远征', year:'第五纪 1187 年', text:'罗塞尔大帝南征北战，将伦堡等国纳入保护。你跟着征粮队走过被战火烧过的村庄，看见废墟上重新长出麦苗。有人说罗塞尔是「百年不遇的征服者」，也有人说他是「要把世界改个样子的疯子」。', reward:'体质+1、金钱+1', attr:{constitution:1, wealth:1} },
    { name:'大帝的日记', year:'第五纪 1190 年', text:'你偶然得见一页罗塞尔日记的抄本，上面写着看不懂的符号和一句中文批注：「今天也研究塔罗牌，灰雾的尽头到底是什么？」你反复读那行字，总觉得里面藏着天大的秘密。', reward:'智慧+2、神秘+1', attr:{wisdom:2, mystery:1} },
    { name:'罗塞尔陨落', year:'第五纪 1198 年末', text:'罗塞尔大帝陨落了。永恒烈阳教会与索伦家族完成了复仇，消息像巨石砸入北大陆。帝国在几日内崩溃，而你站在港口的寒风中，听见桅杆上的黄玫瑰旗帜猎猎作响——那是你第一次真切地感到，一个时代结束了。', reward:'理智-10、神秘+1', attr:{mystery:1}, mind:-10, mandatory:true },
    { name:'遗物的余晖', year:'第五纪 1198 年', text:'罗塞尔陨落后，他的遗物在黑市上被抢购一空。你花高价买下一枚刻着船徽的旧怀表，夜里它偶尔会发出「咔哒、咔哒」的声响——像有人在另一个时代，敲着同一只表。', reward:'神秘+2、金钱-1', attr:{mystery:2}, money:-1 },
  ],
  fool: [
    { name:'愚者教会建立', year:'第五纪 1353 年', text:'愚者教会正式建立。灰雾之上的神秘主宰有了地上的圣殿，塔罗会的成员们开始行走于阳光之下。你在人群里仰望那座新落成的教堂，塔尖高耸，直指灰雾。', reward:'信仰+1', attr:{faith:1} },
    { name:'《愚者圣典》初刊', year:'第五纪 1354 年', text:'愚者教会的《圣典》首次刊行。扉页上印着一枚灰雾中的符号，据说那是最初的圣痕。你买了一本，夜里读到其中一句话：「祂在灰雾之上，看着每一个相信祂的人。」', reward:'信仰+1、智慧+1', attr:{faith:1, wisdom:1} },
    { name:'海神教会的教皇', year:'第五纪 1354 年', text:'倒吊人阿尔杰戴上面具，出任海神教会的教皇。海上的风浪从此有了新的主人。你在港口目送他的船队启航，听见水手们低语：「愚者的信徒，把大海也教会了。」', reward:'幸运+1', attr:{luck:1} },
    { name:'六神教会的联合', year:'第五纪 1355 年', text:'六神教会联合残存的节制派，开始对玫瑰学派进行清剿。教会的圣骑士在夜里出动，火光与低语在城郊蔓延。你隔着几条街，都能闻到那股焚烧的味道。', reward:'勇气+1、理智-5', attr:{courage:1}, mind:-5 },
    { name:'神战余波', year:'第五纪 1352 年末', text:'那场决定命运的神战结束了。克莱恩登临神座成为愚者，击败了阿蒙并回收其权柄。世人并不知道发生了什么，只听说「天上有人打了一架」。而你，在命运的长河边，捡到一粒灰色的、会呼吸的沙。', reward:'神秘+3、理智-10', attr:{mystery:3}, mind:-10 },
    { name:'愚者的沉睡', year:'第五纪 1353 年', text:'愚者沉睡了。祂在源堡中对抗天尊的意志，教会宣称「祂在灰雾之上注视着我们」。你偶尔会在深夜梦见一片灰雾，雾中央有一盏长明的灯。', reward:'信仰+1、理智-5', attr:{faith:1}, mind:-5 },
  ],
};

const SPECIAL_EVENTS = {
  wisdom: {
    10: { title:'智慧初显', story:'深夜的图书馆即将闭馆，管理员老人拦住你：「孩子，你昨天借的那卷《北境诸王编年史》，批注是你写的吗？」他浑浊的眼睛忽然亮了，「我做了四十年管理员，第一次见人把每处存疑的地方都标了出来。留下来，我教你看懂更古老的书。」' },
    15: { title:'智慧之名', story:'王国的大臣亲笔写信，邀请你参与一项秘密研究。信封上印着神秘的羽毛笔徽记，据说与罗塞尔的遗稿有关。' },
    20: { title:'被知识追逐', story:'你开始看得见「知识」本身——它们像活的生物，在书页间游动，在话语里盘旋，在你闭眼时追逐着你。你越是理解这个世界，就越觉得世界在理解你。某天清晨，你翻开一本从未读过的书，却发现扉页上写着你的名字，笔迹正是你自己的。' },
  },
  beauty: {
    10: { title:'清秀初成', story:'街角的画师拦住你，愿意免费为你画一幅肖像——「这样的脸，应该留在画布上。」画像很快被贵族买走，你的名字传开了。' },
    15: { title:'倾国之姿', story:'上流舞会的请柬雪片般飞来，连挑剔的诗人也为你写下十四行诗。一位贵族夫人想收你做义女，带你进入上流社会。' },
    20: { title:'神明之姿', story:'你在镜中看见的自己近乎完美。谣言从舞会传到酒馆，从酒馆传进教会：有一位容貌足以惊动非凡者的存在，正行走在人间。你开始收到匿名礼物——没有人知道送礼者是谁，但其中一件礼物上，压着一枚沾着星屑的信封，里面只有一句话：「我会看着你。」' },
  },
  constitution: {
    10: { title:'力士之名', story:'码头工人与你掰手腕，没有一人撑过三个呼吸。商会会长找到你：「跟我干吧，搬货太屈才了——城里新开了竞技场，赢了有钱拿。以你的力气，今晚就能赢回一周的酒钱。」' },
    15: { title:'铁铸之躯', story:'一场意外中，你从三楼摔落却拍拍灰站起来。几天后，一位衣着朴素、眼神锐利的访客登门，自称是当地非凡者教会的执事：「你的身体是天生的战士坯子。教会需要你这样的人——不是当苦力，是当正式的非凡者。」他留下名片和一句：「想清楚，就来敲那扇没有门牌的门。」' },
    20: { title:'龙血之躯', story:'你赤手掰断铁棍的传闻惊动了教会。一位穿黑袍的主教深夜造访，带来一只密封的银匣：「你的血脉里沉睡着某种古老的力量——比人类更古老。教会想弄清楚那是什么，但我们更想知道：你愿意弄清楚自己是谁吗？」他打开银匣的瞬间，你的心跳得像擂鼓，血管里的血在发烫。' },
  },
  courage: {
    10: { title:'无畏之心', story:'深夜的墓园传来哭声，所有人都绕路，只有你提着灯走了进去——原来是一对迷路的兄妹。你的名声从此带着点传奇色彩。' },
    15: { title:'勇者之名', story:'一场大火中，你冲进浓烟救出七个人。消防队想招你入队，而一位神秘的旅人留下一句话：「这份胆量，非凡世界用得上。」' },
    20: { title:'直面深渊', story:'面对失控的非凡生物，别人都在逃，你握紧拳头挡在了最前面。一位观察者记录下这一幕——你的名字进入了某个组织的视野。' },
  },
  faith: {
    10: { title:'虔诚之光', story:'教堂的烛火在你祈祷时无风自动。神父注意到你，说要带你见一位主教——「你的虔诚，连神明都看得见。」几日后，教会的执事登门，郑重地递上一份文书：你被正式接纳为教会的预备序列者。' },
    15: { title:'圣徒之姿', story:'你病榻旁祈祷时，窗外的阴云裂开一道光。主教亲自接见你，询问你是否愿意接受神圣的试炼。' },
    20: { title:'神恩所钟', story:'神像在你面前似乎眨了一下眼。神职人员们窃窃私语，说你身上有着连他们也无法解释的祝福。当夜，你梦见自己立于云端之上，祂的声音像钟声一样落下：「你之虔诚，当得功勋。」' },
  },
  wealth: {
    10: { title:'小有家资', story:'你用攒下的钱做了笔小买卖，意外大赚。商会的掌柜找上门：「小友，有没有兴趣跟我合伙？」你答应了。后来，你们合伙的商队越跑越远——从郡城到港口，从港口到海外。掌柜教你认账目、看风向、辨货色，也教你一条行商的老规矩：「钱要赚，但昧良心的钱，一便士也不能碰。」第三年，你们在港口盘下一间自己的货栈。掌柜拍着你的肩，笑得眼角的褶子都堆了起来：「小友，我这辈子做过最值的买卖，就是那天找你合伙。」你没有说话，只是看着货栈门口新挂的招牌——上面写着你的姓。' },
      15: { title:'富甲一方', story:'你的投资眼光令银行家侧目，几桩生意让家产翻了几番。贵族们开始请你参加晚宴，想探听你的生财之道。' },
      20: { title:'富可敌国', story:'你的财富引来各方垂涎——也包括神秘世界。一位戴金丝眼镜的绅士递上名片：「金钱，有时比魔药更接近神明。我们正在寻找新的合伙人——如果你愿意，有一扇门为你敞开。那扇门后面，是比银行金库更深的地方。」' },
  },
};
