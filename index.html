/* ===== 商店逻辑 ===== */
function refreshShopPicks(){
  const picks = [];
  const seen = {};
  while (picks.length < 3){
    const it = rollShopItem();
    const key = it.seq + '|' + it.name;
    if (seen[key]) continue;   /* 三件不重复 */
    seen[key] = true;
    picks.push(it);
  }
  state.shopPicks = picks;
  state.shopAge = state.ageStage || 'early';
}
function openShop(kind){
  $('shopModal').classList.add('open');
  renderShop(kind || 'gold');
}
function renderShop(kind){
  const s = state;
  const isMerit = kind === 'merit';
  $('shopTabGold').classList.toggle('active', !isMerit);
  $('shopTabMerit').classList.toggle('active', isMerit);
  $('shopTitle').textContent = isMerit ? '功绩商店' : '神秘商店';
  $('shopSub').textContent = isMerit
    ? '功勋兑换处——官方序列者的特权货架（功绩 ' + (s.merit || 0) + '）'
    : '金钱有时比魔药更接近神明（金钱 ' + (s.wealth || 0) + '）';
  const list = $('shopList');
  list.innerHTML = '';
  const items = isMerit ? MERIT_ITEMS : SHOP_ITEMS;
  items.forEach(function(it){
    const row = document.createElement('div');
    row.className = 'shop-row';
    const affordable = isMerit ? (s.merit || 0) >= it.cost : (s.wealth || 0) >= it.cost;
    row.innerHTML = '<span class="s-name">' + esc(it.name) + '</span><span class="s-desc">' + esc(it.desc) + '</span><span class="s-cost">' + it.cost + (isMerit ? ' 功绩' : ' 金') + '</span>';
    const b = document.createElement('button');
    b.className = 's-buy';
    b.textContent = '购入';
    b.disabled = !affordable;
    b.addEventListener('click', function(){ buyItem(it, isMerit); });
    row.appendChild(b);
    list.appendChild(row);
  });
  renderShopRandom(isMerit);
}
function renderShopRandom(isMerit){
  const s = state;
  const box = $('shopRandom');
  if (isMerit){
    box.innerHTML = '<div class="shop-random-head"><span><b>功绩特供</b> · 稀有物品抽取（高序列概率提升）</span></div>' +
      '<div class="r-item">消耗 5 功绩，从刷新池中抽取一件非凡物品——序列 6 及以上的概率大幅提升。<br>' +
      '<button class="s-buy" id="meritDraw"' + ((s.merit || 0) >= 5 ? '' : ' disabled') + '>抽取（5 功绩）</button></div>';
    const db = $('meritDraw');
    if (db) db.addEventListener('click', function(){ drawItem(true); });
    return;
  }
  if (!s.shopPicks || s.shopPicks.length !== 3 || s.shopAge !== (s.ageStage || 'early')) refreshShopPicks();
  const ageTag = s.ageStage === 'teen' ? '12-18岁' : s.ageStage === 'youth' ? '6-12岁' : '0-6岁';
  const disc = s.luck >= 15 ? '幸运 15 · 7 折' : s.luck >= 10 ? '幸运 10 · 8 折' : '原价';
  box.innerHTML = '<div class="shop-random-head"><span><b>随机非凡物品</b> · ' + ageTag + '刷新（每年龄段一次）</span><em>' + disc + '</em></div>';
  s.shopPicks.forEach(function(it){
    const d = document.createElement('div');
    d.className = 'r-item';
    const price = itemFinalPrice(it);
    d.innerHTML = '<b>' + esc(it.name) + '</b>（' + it.path + '·序列' + it.seq + '）——' + esc(it.desc) +
      '<br><button class="s-buy"' + ((s.wealth || 0) >= price ? '' : ' disabled') + '>' + ((s.wealth || 0) >= price ? '购入（' + price + ' 金）' : '金钱不足（' + price + ' 金）') + '</button>';
    const b = d.querySelector('button');
    b.addEventListener('click', function(){ buyRandomItem(it); });
    box.appendChild(d);
  });
}
function buyItem(it, isMerit){
  const s = state;
  const cur = isMerit ? 'merit' : 'wealth';
  if (s[cur] < it.cost) return;
  s[cur] -= it.cost;
  applyShopKind(it);
  renderShop(isMerit ? 'merit' : 'gold');
  renderModal();
}
function applyShopKind(it){
  const s = state;
  if (it.kind === 'promo'){
    s.promoCount++;
    s.growths.push('商店购入：晋升线索（' + s.promoCount + '/2）');
    if (!s.gifted && s.promoCount >= 2){
      s.promoCount = 2;
      if (s.marks.indexOf('可晋升') < 0) s.marks.push('可晋升');
    }
  } else if (it.kind === 'attr'){
    s[it.attr] = cap20(s[it.attr] + (it.v || 1));
    s.growths.push('商店购入：' + it.name + '（' + attrLabel(it.attr) + '+' + (it.v || 1) + '）');
  } else if (it.kind === 'mind'){
    s.mind = Math.min(200, s.mind + it.v);
    s.growths.push('商店购入：' + it.name + '（理智+' + it.v + '）');
  } else if (it.kind === 'directpromo'){
    if (!s.gifted){
      s.gifted = true;
      if (!s.pathway) s.pathway = PATHWAYS.find(function(x){ return x.seq9 === pick(PATHWAY_POOLS.random); });
      s.seq = 9;
      s.growths.push('功绩兑换：晋升序列9（凡人之躯踏足非凡）');
    } else if (s.seq > 5){
      s.seq = Math.max(1, s.seq - 1);
      s.marks.push('序列' + s.seq);
      s.growths.push('功绩兑换：晋升序列' + s.seq + '（免判定免金钱）');
    } else {
      s.growths.push('功绩兑换：序列已至' + s.seq + '，魔药沉淀');
    }
    if (s.marks.indexOf('序列' + s.seq) < 0) s.marks.push('序列' + s.seq);
  } else if (it.kind === 'protect'){
    if (s.marks.indexOf('教会庇护') < 0) s.marks.push('教会庇护');
    s.growths.push('功绩兑换：教会庇护（下次重伤时伤势减一级）');
  } else if (it.kind === 'ritem'){
    drawItem(false);
  }
}
function buyRandomItem(it){
  const s = state;
  const price = itemFinalPrice(it);
  if (s.wealth < price) return;
  s.wealth -= price;
  s.items.push({ path: it.path, seq: it.seq, neg: NEG_LEVELS[1] });
  s.growths.push('商店购入非凡物品：「' + it.name + '」（' + it.path + '·序列' + it.seq + '，' + price + '金）');
  renderShop('gold');
  renderModal();
}
function drawItem(merit){
  const s = state;
  if (merit){
    if (s.merit < 5) return;
    s.merit -= 5;
  } else {
    if (s.wealth < 5) return;
    s.wealth -= 5;
  }
  const it = rollShopItem(merit ? 'merit' : null);
  s.items.push({ path: it.path, seq: it.seq, neg: NEG_LEVELS[1] });
  s.growths.push((merit ? '功绩抽取' : '金钱抽取') + '非凡物品：「' + it.name + '」（' + it.path + '·序列' + it.seq + '）');
  renderShop(merit ? 'merit' : 'gold');
  renderModal();
  showWheelResult(merit ? '功绩抽取' : '金钱抽取', '你打开那只铅灰色的匣子——<b>' + esc(it.name) + '</b>（' + it.path + '·序列' + it.seq + '）静静躺在丝绒上。<br><em>' + esc(it.desc) + '</em>');
}
